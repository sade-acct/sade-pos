<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sade POS</title>
<meta name="theme-color" content="#f3f2f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --espresso:#f3f3f3;
    --espresso-2:#ffffff;
    --crema:#605e5c;
    --crema-dim:#8a8886;
    --copper:#0078d4;
    --copper-light:#106ebe;
    --paper:#1b1b1b;
    --paper-dim:#484644;
    --ok:#107c10;
    --err:#d13438;
    --line: #e1dfdd;
    --accent-text: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.07), 0 1px 1px rgba(0,0,0,.05);
    --shadow-md: 0 3.2px 7.2px rgba(0,0,0,.11), 0 0.6px 1.8px rgba(0,0,0,.09);
    --shadow-lg: 0 6.4px 14.4px rgba(0,0,0,.13), 0 1.2px 3.6px rgba(0,0,0,.10);
    --numpad-width: 300px;
    --cart-width: 340px;
    --canvas-height: clamp(420px, 62vh, 680px);
    --btn-width: 110px;
    --btn-height: 95px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--espresso);
    color:var(--paper);
    font-family:'Segoe UI Variable Text','Segoe UI','Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Segoe UI Variable Display','Segoe UI','Inter',system-ui,sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- generic ---------- */
  .btn{
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:6px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--copper); color:var(--accent-text); box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--copper-light); box-shadow:var(--shadow-md);}
  .btn-outline{background:var(--espresso-2); color:var(--paper); border-color:var(--line); box-shadow:var(--shadow-sm);}
  .btn-outline:hover{border-color:var(--crema-dim); box-shadow:var(--shadow-md);}
  .btn-danger{background:transparent; color:var(--err); border-color:rgba(209,52,56,0.4);}
  .btn-danger:hover{background:rgba(209,52,56,0.08);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  input,select,textarea{
    font-family:inherit;
    font-size:14px;
    background:var(--espresso-2);
    border:1px solid var(--line);
    color:var(--paper);
    padding:10px 12px;
    border-radius:6px;
    width:100%;
    outline:none;
  }
  textarea{resize:vertical; min-height:60px; font-family:inherit;}
  input:focus,select:focus,textarea:focus{border-color:var(--copper); box-shadow:0 0 0 1px var(--copper);}
  label{font-size:12px; color:var(--crema-dim); display:block; margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .card{
    background:var(--espresso-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
    box-shadow:var(--shadow-sm);
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:4px 10px; border-radius:20px;
    border:1px solid var(--line); color:var(--crema-dim); background:var(--espresso-2);
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--crema-dim);}
  .dot.live{background:var(--ok); box-shadow:0 0 0 0 rgba(122,154,108,.6); animation:pulse 2s infinite;}
  .dot.offline{background:var(--err);}
  .dot.warn{background:#f5a623;}
  .product-btn.soldout{opacity:.5; position:relative;}
  .soldout-tag{position:absolute; top:6px; right:6px; background:var(--err); color:#fff; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:10px;}
  .inv-row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--line);}
  .inv-main{display:flex; align-items:center; gap:10px; min-width:200px; flex:1;}
  .inv-dot{width:11px; height:11px; border-radius:50%; flex:none; background:var(--ok);}
  .inv-dot.low{background:#f5a623;}
  .inv-dot.out{background:var(--err);}
  .inv-qty{font-weight:700; font-size:15px; margin-left:auto; padding-left:12px; white-space:nowrap;}
  .inv-sub{font-size:11.5px; color:var(--crema-dim);}
  .inv-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .inv-actions .btn{padding:6px 10px; font-size:12.5px;}
  .sup-limited .free-toggle-row, .sup-limited .settings-section{display:none;}
  .an-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
  .an-stat{border:1px solid var(--line); border-radius:8px; padding:12px;}
  .an-stat b{display:block; font-size:20px; margin-bottom:2px;}
  .an-stat span{font-size:11.5px; color:var(--crema-dim);}
  .an-bar{height:8px; border-radius:4px; background:var(--copper); min-width:2px;}
  .an-hours{display:flex; align-items:flex-end; gap:4px; height:130px; margin:10px 0 4px;}
  .an-hours .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%;}
  .an-hours .col div{width:100%; background:var(--copper); border-radius:3px 3px 0 0; min-height:2px;}
  .an-hlabels{display:flex; gap:4px; font-size:10px; color:var(--crema-dim);}
  .an-hlabels span{flex:1; text-align:center;}
  .an-sec{margin-bottom:22px;}
  .an-sec h4{font-size:13px; margin-bottom:8px;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(122,154,108,.55);}
    70%{box-shadow:0 0 0 6px rgba(122,154,108,0);}
    100%{box-shadow:0 0 0 0 rgba(122,154,108,0);}
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--espresso-2); border:1px solid var(--line); color:var(--paper);
    padding:11px 18px; border-radius:8px; font-size:13px; z-index:999;
    box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:90vw; text-align:center;
  }
  .toast.err{border-color:rgba(181,69,58,.5); color:#f0b8b2;}
  .toast.ok{border-color:rgba(122,154,108,.5); color:#cfe3c6;}
  a.link{color:var(--copper-light); cursor:pointer; text-decoration:none; font-size:13px;}
  a.link:hover{text-decoration:underline;}
  .hr{border:none; border-top:1px dashed var(--paper-dim); opacity:.25; margin:14px 0;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--espresso-2); border-radius:6px;}

  /* ---------- centered screens (connect / login / setup) ---------- */
  .center-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 15% 10%, rgba(181,101,47,0.14), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(233,201,150,0.08), transparent 45%);
  }
  .panel{width:100%; max-width:380px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
  .brand .mark{
    width:38px;height:38px;border-radius:6px;background:var(--copper);
    display:flex;align-items:center;justify-content:center;
    font-weight:700; color:var(--accent-text); font-size:18px; overflow:hidden;
  }
  .brand .mark img{width:100%; height:100%; object-fit:cover;}
  .brand .name{font-size:19px;}
  .brand .sub{font-size:11px; color:var(--crema-dim); letter-spacing:.03em;}

  /* ---------- shell (logged-in layout) ---------- */
  .shell{flex:1; display:flex; flex-direction:column; min-height:100vh;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--espresso-2); flex-wrap:wrap; gap:10px;
    box-shadow:var(--shadow-sm);
  }
  .topbar .left{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .topbar .who{font-size:13px; color:var(--crema-dim);}
  .topbar .who b{color:var(--paper);}
  .topbar .actions{display:flex; align-items:center; gap:14px;}
  .role-tag{
    font-size:10px; font-weight:700; letter-spacing:.06em; padding:3px 9px; border-radius:4px;
    background:var(--copper); color:var(--accent-text);
  }
  .main{flex:1; padding:22px; max-width:1400px; width:100%; margin:0 auto;}
  .main.main-full{max-width:100%;}

  /* ---------- POS (cashier) ---------- */
  .pos-layout{display:grid; grid-template-columns:1fr var(--numpad-width) var(--cart-width); gap:18px; align-items:start;}
  @media(max-width:1150px){.pos-layout{grid-template-columns:1fr; }}
  .product-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(96px,11vw,130px),1fr)); gap:10px;
  }
  .product-btn{
    aspect-ratio:1/0.85; border-radius:6px; border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; padding:10px; text-align:center; background:var(--espresso-2);
    transition:transform .08s ease, border-color .15s ease, box-shadow .15s ease;
    box-shadow:var(--shadow-sm);
  }
  .product-btn:hover{box-shadow:var(--shadow-md);}
  .product-btn:active{transform:scale(0.95);}
  .product-btn .emoji{font-size:26px;}
  .product-btn .pname{font-size:12.5px; font-weight:600; line-height:1.25;}
  .product-btn .pprice{font-size:11px; color:var(--crema-dim);}
  .product-btn .pcat{font-size:9px; color:var(--crema-dim); opacity:.7;}
  .product-btn.numpad-tile{border-style:dashed;}
  .cart-panel{
    background:var(--espresso-2); border:1px solid var(--line); border-radius:8px;
    display:flex; flex-direction:column; max-height:calc(100vh - 130px); position:sticky; top:18px;
    box-shadow:var(--shadow-md);
  }
  .cart-head{padding:14px 16px; border-bottom:1px solid var(--line);}
  .cart-head h3{opacity:1;}
  .cart-items{flex:1; overflow-y:auto; padding:8px 16px;}
  .cart-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);}
  .cart-row:last-child{border-bottom:none;}
  .cart-row .ci-name{font-size:13.5px; font-weight:500;}
  .cart-row .ci-meta{font-size:11px; color:var(--crema-dim);}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{
    width:29px;height:44px; border-radius:4px; border:1px solid var(--line); background:transparent;
    color:var(--paper); cursor:pointer; font-size:17px; line-height:1;
  }
  .cart-foot{padding:14px 16px; border-top:1px solid var(--line);}
  .total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .total-row .amt{font-size:clamp(20px,2vw,26px); font-weight:700;}
  .pay-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .pay-toggle button{flex:1; padding:9px; border-radius:4px; border:1px solid var(--line); background:transparent; color:var(--crema-dim); cursor:pointer; font-size:13px; font-weight:600;}
  .pay-toggle button.active{background:var(--copper); color:var(--accent-text); border-color:var(--copper);}
  .empty-cart{padding:30px 10px; text-align:center; color:var(--crema-dim); font-size:13px;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--crema-dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--espresso-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; box-shadow:var(--shadow-sm);}
  .stat .label{font-size:11px; color:var(--crema-dim); margin-bottom:6px;}
  .stat .value{font-size:clamp(18px,2vw,24px); font-weight:700;}

  .tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .tab{padding:10px 16px; font-size:13px; font-weight:600; color:var(--crema-dim); cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--paper); border-bottom-color:var(--copper);}

  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:var(--espresso-2); background:color-mix(in srgb, var(--espresso-2) 88%, transparent); backdrop-filter:blur(20px) saturate(1.3); border:1px solid var(--line); border-radius:12px; padding:22px; max-width:440px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
  .modal h3{margin-bottom:16px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .modal-actions .btn{flex:1;}

  .receipt{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; background:#fdfbf7; color:#231a12;
    border-radius:6px; padding:18px; line-height:1.6;
  }
  .receipt .rline{display:flex; justify-content:space-between;}
  .receipt hr{border:none; border-top:1px dashed #231a12; opacity:.35; margin:8px 0;}
  .receipt .rsub{padding-left:14px; font-size:11.5px; opacity:.85; line-height:1.4;}
  .receipt .rnum{align-items:baseline;}
  .receipt .rnum .num{font-size:1.5em; line-height:1.2;}
  .ci-opts{font-size:11px; color:var(--crema-dim); margin-top:2px; line-height:1.35;}
  .opt-group{margin-bottom:16px;}
  .opt-group h4{font-size:13px; margin-bottom:8px;}
  .opt-group h4 small{font-weight:400; color:var(--crema-dim); margin-left:6px;}
  .opt-choice{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:14px;}
  .opt-choice input{width:auto !important; margin:0;}
  .opt-choice .opt-extra{margin-left:auto; color:var(--crema-dim); font-size:12px;}
  .opt-choice:has(input:checked){border-color:var(--copper);}
  .og-box{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;}
  .og-row{display:flex; gap:8px; margin-bottom:6px;}
  .og-row input{min-width:0;}

  .empty-state{padding:50px 20px; text-align:center; color:var(--crema-dim);}
  .empty-state .big{font-size:38px; margin-bottom:10px;}

  .banner{padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; border:1px solid;}
  .banner.warn{background:rgba(217,138,82,.08); border-color:rgba(217,138,82,.35); color:var(--copper-light);}
  .banner.err{background:rgba(181,69,58,.08); border-color:rgba(181,69,58,.35); color:#e5978d;}
  .banner.ok{background:rgba(122,154,108,.08); border-color:rgba(122,154,108,.35); color:#cfe3c6;}

  code{background:var(--espresso); padding:1px 6px; border-radius:4px; font-size:12px;}
  .setup-steps li{margin-bottom:10px; font-size:13px; color:var(--paper-dim); line-height:1.5;}

  /* ---------- coupon row ---------- */
  .coupon-row{display:flex; gap:8px; margin-bottom:10px;}
  .coupon-row input{flex:1;}
  .applied-coupon{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(122,154,108,0.1); border:1px solid rgba(122,154,108,.35);
    color:#cfe3c6; padding:7px 10px; border-radius:7px; font-size:12.5px; margin-bottom:10px;
  }
  .applied-coupon a{color:#e5978d; cursor:pointer; font-weight:600;}
  .discount-row{display:flex; justify-content:space-between; font-size:13px; color:var(--ok); margin-bottom:6px;}

  /* ---------- draggable buttons / rows ---------- */
  .product-btn.draggable{cursor:grab;}
  .product-btn.dragging{opacity:0.35;}
  .product-btn.drag-over{border-color:var(--copper-light); box-shadow:0 0 0 2px var(--copper-light) inset;}
  .drag-hint{font-size:11.5px; color:var(--crema-dim); margin-bottom:10px;}
  .cat-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:grab; background:var(--espresso);}
  .cat-row.dragging{opacity:.4;}
  .cat-row.drag-over{border-color:var(--copper-light); box-shadow:0 0 0 2px var(--copper-light) inset;}
  .cat-row .cname{font-weight:600; font-size:13.5px;}
  .cat-row .ccount{font-size:11px; color:var(--crema-dim);}

  /* ---------- fixed N-column grid (auto-aligned, developer sets rows/cols) ---------- */
  .product-grid.fixed-grid{
    grid-template-columns:repeat(var(--grid-cols,6), 1fr);
    grid-auto-rows:var(--btn-height, 100px);
    overflow-y:auto; padding:4px; border:1px dashed var(--line); border-radius:8px;
  }
  .product-grid.fixed-grid .product-btn{ aspect-ratio:auto; height:100%; }
  .free-toggle-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}

  /* ---------- numpad ---------- */
  .numpad-panel{
    background:var(--espresso-2); border:1px solid var(--line); border-radius:8px; padding:14px;
    box-shadow:var(--shadow-md); position:sticky; top:18px;
  }
  .numpad-panel h3{font-size:14px; margin-bottom:10px;}
  .numpad-target{font-size:12.5px; color:var(--crema-dim); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .numpad-target a{color:var(--err); cursor:pointer;}
  .numpad-display{font-family:'JetBrains Mono',monospace; font-size:clamp(20px,2.4vw,28px); text-align:right; padding:12px 14px; background:var(--espresso); border:1px solid var(--line); border-radius:6px; margin-bottom:12px;}
  .numpad-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .numpad-grid button{padding:clamp(10px,1.6vw,16px); font-size:clamp(15px,1.6vw,19px); border-radius:6px; border:1px solid var(--line); background:var(--espresso); color:var(--paper); cursor:pointer; font-family:'JetBrains Mono',monospace;}
  .numpad-grid button:active{background:var(--copper); color:var(--accent-text);}

  /* ---------- settings ---------- */
  .settings-section{margin-bottom:24px;}
  .settings-section h4{font-size:12px; color:var(--crema-dim); margin-bottom:12px; text-transform:uppercase; letter-spacing:.05em;}
  .logo-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .logo-preview{width:56px; height:56px; border-radius:10px; object-fit:cover; background:var(--espresso); border:1px solid var(--line);}
  .logo-preview.empty{display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--crema-dim);}
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:8px;}
  .theme-swatch-field{display:flex; align-items:center; gap:10px; background:var(--espresso); border:1px solid var(--line); border-radius:8px; padding:9px 12px;}
  .theme-swatch-field input[type=color]{width:34px; height:34px; padding:0; border:none; border-radius:6px; background:none; cursor:pointer;}
  .theme-swatch-field .tlabel{font-size:12.5px; flex:1;}
  .theme-swatch-field .tval{font-size:11px; color:var(--crema-dim);}
  .inline-row{display:flex; gap:10px; align-items:flex-end;}
  .inline-row .field{flex:1; margin-bottom:0;}

  /* ---------- print ---------- */
  #printArea{display:none;}
  @media print{
    @page{ margin:6mm; }
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block; position:absolute; top:0; left:0; width:100%;
      background:#fff; color:#000; padding:0;
    }
  }

  /* ---------- landscape-only on phones ----------
     manifest.json's "orientation":"landscape" locks this when installed as a
     PWA on Android, but that isn't honored on iOS or in a plain browser tab,
     so this overlay is the reliable fallback everywhere. */
  #rotateOverlay{display:none;}
  @media (max-width:900px) and (orientation:portrait){
    #app{display:none;}
    #rotateOverlay{
      display:flex; position:fixed; inset:0; z-index:9999;
      background:var(--espresso); color:var(--paper);
      flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:30px; gap:14px;
    }
    #rotateOverlay .icon{font-size:52px; animation:rotateHint 1.8s ease-in-out infinite;}
    @keyframes rotateHint{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(90deg);} }
  }

<script>
/* =========================================================================
   SADE POS — single-file PWA point of sale backed by a private GitHub repo.

/* ---------------- CONFIG ----------------
   Fill these in to match your own private GitHub repository (see the

const CONFIG = {
  // The same file works for every shop: on GitHub Pages the account name is read from the web
  // address (https://<account>.github.io/...), so nothing needs editing per site.

  GITHUB_REPO: "sade-pos-data",    // each account keeps its data in its own PRIVATE repo with this name

  DB_FILENAME: "sade_pos_db.json", // path of the database file inside that repo
  SYNC_INTERVAL_MS: 20000
};

/* Matches Windows 11's actual system Light/Dark palettes (window bg, card/control
   surfaces, default accent blue, and text) so the quick-select presets feel native. */
const LIGHT_THEME = {
  bg:"#f3f3f3", bg2:"#ffffff", accent:"#0078d4", accentLight:"#106ebe", text:"#1b1b1b"
};
const DARK_THEME = {
  bg:"#202020", bg2:"#2c2c2c", accent:"#4cc2ff", accentLight:"#60cdff", text:"#ffffff"
};
const DEFAULT_THEME = { ...LIGHT_THEME };

const CURRENCY_PRESETS = [
  {code:"USD", symbol:"$"}, {code:"EUR", symbol:"€"}, {code:"GBP", symbol:"£"},
  {code:"TRY", symbol:"₺"}, {code:"JPY", symbol:"¥"}, {code:"CUSTOM", symbol:""}
];

/* ---------------- STATE ---------------- */
const state = {
  accessToken: null,   // GitHub Personal Access Token
  fileSha: null,       // current known blob sha of the database file (GitHub requires this to write)
  dbFileId: null,
  db: null,
  currentUser: null,
  cart: [],
  payMethod: "cash",
  appliedCoupon: null,
  view: null,
  adminTab: "live",
  devTab: "products",
  syncTimer: null,
  saving: false,
  offlinePending: false,
  dragProductId: null,
  dragCategoryId: null,

const $ = sel => document.querySelector(sel);
const app = () => document.getElementById("app");
const uid = () => crypto.randomUUID();
const nowIso = () => new Date().toISOString();

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pad2(n){ return String(n).padStart(2,"0"); }
/* dd/mm/yyyy — accepts an ISO timestamp, a Date, or a "yyyy-mm-dd" string */
function fmtDate(v){
  if(typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v)){ const p=v.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  const d = new Date(v);
  if(isNaN(d)) return "";
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear();
}
function fmtDateTime(v){
  const d = new Date(v);
  if(isNaN(d)) return "";
  return fmtDate(d)+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function money(n){
  const amt = (Math.round((n||0)*100)/100).toFixed(2);
  const code = state.db && state.db.meta ? state.db.meta.currencyCode : "USD";
  if(code === "TRY"){
    return amt + ' <span style="font-size:0.75em;">tl</span>';
  }
  const sym = (state.db && state.db.meta && state.db.meta.currencySymbol) || "$";
  return sym + amt;
}
/* plain-text version (no HTML) for places that can't render markup, e.g. window.print titles */
function moneyText(n){
  const amt = (Math.round((n||0)*100)/100).toFixed(2);
  const code = state.db && state.db.meta ? state.db.meta.currencyCode : "USD";
  if(code === "TRY") return amt + " tl";
  const sym = (state.db && state.db.meta && state.db.meta.currencySymbol) || "$";
  return sym + amt;
}

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " "+kind : "");

  document.body.appendChild(t);

}

/* ---------------- DEFAULT DB ---------------- */
function defaultDb(){

      { id: uid(), name:"Espresso", price:3.00, categoryId:catCoffee, emoji:"☕", color:"#b5652f", isDrink:true, active:true, order:0, updatedAt: nowIso() },
      { id: uid(), name:"Latte", price:4.50, categoryId:catCoffee, emoji:"🥛", color:"#c7a877", isDrink:true, active:true, order:1, updatedAt: nowIso() },
      { id: uid(), name:"Cappuccino", price:4.25, categoryId:catCoffee, emoji:"☕", color:"#8a5a34", isDrink:true, active:true, order:2, updatedAt: nowIso() },
      { id: uid(), name:"Cold Brew", price:4.75, categoryId:catCoffee, emoji:"🧊", color:"#3d3128", isDrink:true, active:true, order:3, updatedAt: nowIso() },
      { id: uid(), name:"Croissant", price:3.50, categoryId:catBakery, emoji:"🥐", color:"#d9a441", isDrink:false, active:true, order:4, updatedAt: nowIso() },
      { id: uid(), name:"Muffin", price:3.25, categoryId:catBakery, emoji:"🧁", color:"#a8763e", isDrink:false, active:true, order:5, updatedAt: nowIso() },

}

/* bring an older/incomplete db up to the current shape — always safe to re-run */
/* Day-close reports: when two reports are identical in everything but the closing time
   (same date, cashier, transaction count, cash, card, coupons and total), only the latest
   is kept and the earlier one(s) are removed. Runs on every load/merge, so a removed copy
   can't come back from another device. */
function dedupeDayCloses(list){
  const best = new Map();
  (list||[]).forEach(c=>{
    const b = c.breakdown || {};
    const key = [
      c.date, c.cashierId || c.cashierName, c.transactionCount,
      Math.round((+b.cash||0)*100), Math.round((+b.card||0)*100), Math.round((+c.totalSales||0)*100),
      (b.couponsUsed||[]).length, Math.round((+b.couponsDiscountTotal||0)*100)
    ].join("|");
    const cur = best.get(key);
    const t = new Date(c.closedAt || 0).getTime() || 0;
    const ct = cur ? (new Date(cur.closedAt || 0).getTime() || 0) : -1;
    if(!cur || t > ct || (t === ct && String(c.id) > String(cur.id))) best.set(key, c);
  });
  const keep = new Set([...best.values()].map(c=>c.id));
  return (list||[]).filter(c=>keep.has(c.id));
}

/* A device only claims "my settings are the newest" when its settings really changed.
   (Before, every sale bumped the settings timestamp, so a cashier device could overwrite a
   switch the developer had just changed — e.g. the Staff on/off switch.) */
function metaFp(m){ const c = { ...m }; delete c.updatedAt; delete c._fp; return JSON.stringify(c); }

function migrateDb(db){
  db.meta = db.meta || {};
  if(db.meta.appActive===undefined) db.meta.appActive = true;
  if(!db.meta.businessName) db.meta.businessName = "Sade Coffee";
  if(!db.meta.currencySymbol) db.meta.currencySymbol = "$";
  if(!db.meta.currencyCode) db.meta.currencyCode = "USD";
  if(db.meta.freeLayout===undefined) db.meta.freeLayout = false;
  if(!db.meta.layout) db.meta.layout = { numpadWidth: 300, cartWidth: 340, canvasHeight: 560, btnWidth: 110, btnHeight: 95 };
  if(db.meta.layout.btnWidth===undefined) db.meta.layout.btnWidth = 110;
  if(db.meta.layout.btnHeight===undefined) db.meta.layout.btnHeight = 95;
  if(!db.meta.roleLabels) db.meta.roleLabels = { admin: "Admin", cashier: "Cashier" };
  if(!db.meta.roleLabels.admin) db.meta.roleLabels.admin = "Admin";
  if(!db.meta.roleLabels.cashier) db.meta.roleLabels.cashier = "Cashier";
  if(!db.meta.adminTabs) db.meta.adminTabs = { live:true, reports:true, menu:true, categories:true, coupons:true, team:true };
  ["live","reports","menu","categories","coupons","team"].forEach(k=>{
    if(db.meta.adminTabs[k]===undefined) db.meta.adminTabs[k] = true;
  });
  if(db.meta.adminTabs.analytics===undefined) db.meta.adminTabs.analytics = false;   // sales reports: off for admins until the developer turns them on
  if(db.meta.printCopies===undefined) db.meta.printCopies = 1;
  if(db.meta.receiptHeader===undefined) db.meta.receiptHeader = "";
  if(!db.meta.receiptFooter) db.meta.receiptFooter = "Thank you!";
  if(db.meta.autoPrintReceipt===undefined) db.meta.autoPrintReceipt = true;
  if(db.meta.logoDataUrl===undefined) db.meta.logoDataUrl = null;
  if(!db.meta.theme) db.meta.theme = {...DEFAULT_THEME};
  if(!db.meta.updatedAt) db.meta.updatedAt = nowIso();
  if(db.meta.staffEnabled===undefined) db.meta.staffEnabled = false;
  if(db.meta.staffPinRequired===undefined) db.meta.staffPinRequired = false;
  if(db.meta.staffDiscountPercent===undefined) db.meta.staffDiscountPercent = 100;
  if(db.meta.inventoryEnabled===undefined) db.meta.inventoryEnabled = false;
  if(db.meta.inventoryAdmin===undefined) db.meta.inventoryAdmin = true;
  if(!db.meta.inventoryCashier) db.meta.inventoryCashier = "log";
  if(db.meta.reportEmailEnabled===undefined) db.meta.reportEmailEnabled = false;
  if(db.meta.reportEmail===undefined) db.meta.reportEmail = "";

  db.staff = db.staff || [];
  db.staffUsage = db.staffUsage || [];
  db.invItems = db.invItems || [];
  db.invMoves = db.invMoves || [];
  db.users = db.users || [];
  db.products = db.products || [];
  db.coupons = db.coupons || [];
  db.sales = db.sales || [];
  db.dayCloses = dedupeDayCloses(db.dayCloses || []);

  if(!db.categories || db.categories.length===0){
    db.categories = [
      { id: uid(), name:"Coffee", order:0 },
      { id: uid(), name:"Bakery", order:1 },
    ];
  }
  db.products.forEach((p,i)=>{
    if(!p.categoryId){
      const match = db.categories.find(c=>c.name.toLowerCase()===String(p.category||"").toLowerCase());
      p.categoryId = match ? match.id : db.categories[0].id;
    }
    if(p.isDrink===undefined) p.isDrink = true;
    if(p.order===undefined) p.order = i;
    if(p.active===undefined) p.active = true;
    if(p.price===undefined) p.price = 0;
    if(!p.pos){
      // fallback grid so nothing overlaps if free layout gets turned on later
      const col = i % 6, row = Math.floor(i/6);
      p.pos = { xPct: 4 + col*16, yPct: 6 + row*22 };
    }
  });
  db.sales.forEach(s=>{
    if(s.subtotal===undefined) s.subtotal = s.total;
    if(s.discountAmt===undefined) s.discountAmt = 0;
    if(s.discountPercent===undefined) s.discountPercent = 0;
  });
  db.meta._fp = metaFp(db.meta);
  return db;
}

/* apply theme colors from db.meta.theme onto the page */
function hexLuminance(hex){
  hex = (hex||"#ffffff").replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const r=parseInt(hex.substr(0,2),16)||0, g=parseInt(hex.substr(2,2),16)||0, b=parseInt(hex.substr(4,2),16)||0;
  return (0.299*r+0.587*g+0.114*b)/255;
}
function applyDerivedNeutrals(bgHex){
  const dark = hexLuminance(bgHex) < 0.5;
  const root = document.documentElement.style;
  root.setProperty("--line", dark ? "rgba(255,255,255,0.14)" : "#e1dfdd");
  root.setProperty("--crema", dark ? "#e9c996" : "#605e5c");
  root.setProperty("--crema-dim", dark ? "#c7a877" : "#8a8886");
  root.setProperty("--paper-dim", dark ? "#d9cbb4" : "#484644");
}
/* text placed on top of the accent color (buttons, badges) needs to flip
   dark/light depending on how bright the accent itself is */
function applyAccentText(accentHex){
  const dark = hexLuminance(accentHex) < 0.6;
  document.documentElement.style.setProperty("--accent-text", dark ? "#ffffff" : "#1b1b1b");
}

function applyTheme(){
  const t = (state.db && state.db.meta && state.db.meta.theme) ? state.db.meta.theme : DEFAULT_THEME;
  const root = document.documentElement.style;
  root.setProperty("--espresso", t.bg || DEFAULT_THEME.bg);
  root.setProperty("--espresso-2", t.bg2 || DEFAULT_THEME.bg2);
  root.setProperty("--copper", t.accent || DEFAULT_THEME.accent);
  root.setProperty("--copper-light", t.accentLight || DEFAULT_THEME.accentLight);
  root.setProperty("--paper", t.text || DEFAULT_THEME.text);
  applyDerivedNeutrals(t.bg || DEFAULT_THEME.bg);
  applyAccentText(t.accent || DEFAULT_THEME.accent);
  applyLayout();
  applyBrandingToTab();
}
/* keeps the browser tab's title and favicon in sync with the developer's
   business name / logo settings, so there's nothing to hand-edit in code */
function applyBrandingToTab(){
  if(!state.db || !state.db.meta) return;

}
function applyThemeDraft(draft){
  const root = document.documentElement.style;
  root.setProperty("--espresso", draft.bg);
  root.setProperty("--espresso-2", draft.bg2);
  root.setProperty("--copper", draft.accent);
  root.setProperty("--copper-light", draft.accentLight);
  root.setProperty("--paper", draft.text);
  applyDerivedNeutrals(draft.bg);
  applyAccentText(draft.accent);
}

const DEFAULT_LAYOUT = { numpadWidth: 300, cartWidth: 340, canvasHeight: 560, btnWidth: 110, btnHeight: 95 };
function applyLayout(){
  const l = (state.db && state.db.meta && state.db.meta.layout) ? state.db.meta.layout : DEFAULT_LAYOUT;
  const root = document.documentElement.style;
  root.setProperty("--numpad-width", (l.numpadWidth||DEFAULT_LAYOUT.numpadWidth) + "px");
  root.setProperty("--cart-width", (l.cartWidth||DEFAULT_LAYOUT.cartWidth) + "px");

  root.setProperty("--btn-width", (l.btnWidth||DEFAULT_LAYOUT.btnWidth) + "px");
  root.setProperty("--btn-height", (l.btnHeight||DEFAULT_LAYOUT.btnHeight) + "px");
}
function applyLayoutDraft(draft){
  const root = document.documentElement.style;

  root.setProperty("--cart-width", draft.cartWidth + "px");

  root.setProperty("--btn-width", draft.btnWidth + "px");
  root.setProperty("--btn-height", draft.btnHeight + "px");
}

/* developer-customizable display names for the admin/cashier roles */
function roleLabel(key){
  if(key==="developer") return "Developer";
  const labels = state.db && state.db.meta && state.db.meta.roleLabels;
  return (labels && labels[key]) || (key.charAt(0).toUpperCase()+key.slice(1));
}

/* print any HTML fragment using a hidden print-only container.
   `copies` repeats the fragment in the SAME print job (one dialog, N copies
   separated by page breaks) rather than calling window.print() repeatedly,
   which would stack multiple dialogs. Only sale receipts pass a copies
   count; printed reports stay at a single copy. */
function printHTML(innerHtml, copies){
  copies = Math.max(1, copies || 1);
  let area = document.getElementById("printArea");
  if(!area){
    area = document.createElement("div");
    area.id = "printArea";
    document.body.appendChild(area);
  }
  area.innerHTML = Array.from({length:copies}, ()=>innerHtml)
    .join('<div style="page-break-after:always; height:0;"></div>');
  window.print();
}

/* wraps receipt/report rows with the developer's logo, business name, header & footer */
function receiptWrap(innerRowsHtml){
  const m = state.db.meta;
  return `
    ${m.logoDataUrl ? `<div style="text-align:center;margin-bottom:6px;"><img src="${m.logoDataUrl}" style="max-height:50px;max-width:150px;"/></div>` : ""}
    <div style="text-align:center;font-weight:700;">${m.businessName||"Sade Coffee"}</div>
    ${m.receiptHeader ? `<div style="text-align:center;font-size:11px;white-space:pre-line;margin-top:2px;">${m.receiptHeader}</div>` : ""}
    <hr/>
    ${innerRowsHtml}
    <hr/>
    <div style="text-align:center;font-size:11px;white-space:pre-line;">${m.receiptFooter||"Thank you!"}</div>`;
}

/* ---------------- LOCAL CACHE (offline resilience) ----------------
   NOTE: uses localStorage, which only works once this file is hosted on
   its own real address (GitHub Pages, etc) — not inside Claude's in-chat
   preview. It's a safety net so a dropped connection mid-shift doesn't
   lose sales; it is not a substitute for the GitHub-hosted database. */
function cacheKey(){ return "sade_cache_" + CONFIG.DB_FILENAME; }
function saveLocalCache(){
  try{ localStorage.setItem(cacheKey(), JSON.stringify({ dbFileId: state.dbFileId, db: state.db })); }catch(e){}
}
function loadLocalCache(){
  try{ const raw = localStorage.getItem(cacheKey()); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}

/* ================= GITHUB STORAGE LAYER =================
   Same role Google Drive used to play — one JSON file is the whole database.
   Function names (connectDrive, driveReadFile, driveWriteFile, authHeaders,
   pushToDrive, pullFromDrive...) are kept as-is throughout the app even
   though the backend is now GitHub, so nothing elsewhere had to change. */

function authHeaders(){
  return { "Authorization": "token " + state.accessToken, "Accept": "application/vnd.github+json" };
}
function ghApiUrl(){
  return `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.DB_FILENAME}`;
}
/* UTF-8 safe base64 (GitHub's Contents API stores file bodies as base64) */
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,"")))); }

/* "Connecting" now just means validating the pasted token works, rather
   than an OAuth popup flow. */
/* Checks the token and the data repository, and throws an error whose message says exactly what is wrong. */
async function connectDrive(){
  if(!state.accessToken) throw new Error("No access token set");
  const repoName = CONFIG.GITHUB_OWNER + "/" + CONFIG.GITHUB_REPO;
  let res;
  try{
    res = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}`, { headers: authHeaders() });
  }catch(e){ throw new Error("No internet connection"); }
  if(res.status === 401) throw new Error("The token is invalid or expired — create a new one and paste it again");
  if(res.status === 404) throw new Error(`Repository ${repoName} was not found, or this token can't see it. Check the name, and create the token on the ${CONFIG.GITHUB_OWNER} account with this repository selected`);
  if(res.status === 403) throw new Error("GitHub refused the token (403) — check its permissions or wait a minute if you tried many times");
  if(!res.ok) throw new Error("GitHub error " + res.status);
  const info = await res.json();
  if(info.private === false) throw new Error(`${repoName} is PUBLIC — set it to Private in the repository settings first, so your sales data stays hidden`);
  if(info.permissions && info.permissions.push === false) throw new Error("This token is read-only — set Contents to Read and write");
  // a missing database file (404) is fine here — it is created next.
}

async function driveFindDbFile(){
  const res = await fetch(ghApiUrl(), { headers: authHeaders() });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error("GitHub read failed: "+res.status);
  const data = await res.json();
  state.fileSha = data.sha;
  return { id: CONFIG.DB_FILENAME };
}

async function driveCreateDbFile(dbObj){
  const res = await fetch(ghApiUrl(), {
    method: "PUT",
    headers: { ...authHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({
      message: "Initialize Sade POS database",
      content: utf8ToBase64(JSON.stringify(dbObj, null, 2))
    })
  });
  if(res.status === 403 || res.status === 404) throw new Error(`GitHub won't let this token create the database file (${res.status}). On the token, set Contents to Read and write for ${CONFIG.GITHUB_REPO}`);
  if(!res.ok) throw new Error("Couldn't create the database file (GitHub " + res.status + ")");
  const data = await res.json();
  state.fileSha = data.content.sha;
  return CONFIG.DB_FILENAME;
}

async function driveReadFile(fileId){
  const res = await fetch(ghApiUrl(), { headers: authHeaders() });
  if(!res.ok) throw new Error("GitHub read failed: "+res.status);
  const data = await res.json();
  state.fileSha = data.sha;
  return JSON.parse(base64ToUtf8(data.content));
}

async function driveWriteFile(fileId, dbObj){
  const res = await fetch(ghApiUrl(), {
    method: "PUT",
    headers: { ...authHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({
      message: "Update Sade POS data",
      content: utf8ToBase64(JSON.stringify(dbObj, null, 2)),
      sha: state.fileSha
    })
  });
  if(res.status === 409 || res.status === 422){
    // our copy of the file's sha is stale — someone else saved first.
    // Re-fetch, merge their changes into ours, and retry once with the
    // fresh sha, the same spirit as the old Drive merge-before-write.
    const remote = await driveReadFile();
    state.db = migrateDb(mergeDb(dbObj, remote));
    const retry = await fetch(ghApiUrl(), {
      method: "PUT",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Update Sade POS data (merged)",
        content: utf8ToBase64(JSON.stringify(state.db, null, 2)),
        sha: state.fileSha
      })
    });
    if(!retry.ok) throw new Error("GitHub write failed: "+retry.status);
    const data = await retry.json();
    state.fileSha = data.content.sha;
    return;
  }
  if(!res.ok) throw new Error("GitHub write failed: "+res.status);
  const data = await res.json();
  state.fileSha = data.content.sha;
}

/* merge remote + local: newer 'updatedAt' wins per-record; sales/dayCloses union by id */
function mergeDb(local, remote){
  if(!remote) return local;
  if(!local) return remote;
  const merged = { meta: null, users: [], products: [], categories: [], coupons: [], staff: [], staffUsage: [], invItems: [], invMoves: [], sales: [], dayCloses: [] };
  merged.meta = (new Date(remote.meta.updatedAt) > new Date(local.meta.updatedAt)) ? remote.meta : local.meta;

  function mergeById(a, b){
    const map = {};
    [...(a||[]), ...(b||[])].forEach(rec=>{
      const existing = map[rec.id];
      if(!existing || new Date(rec.updatedAt || rec.createdAt || 0) >= new Date(existing.updatedAt || existing.createdAt || 0)){
        map[rec.id] = rec;
      }
    });
    return Object.values(map);
  }
  merged.users = mergeById(local.users, remote.users);
  merged.products = mergeById(local.products, remote.products);
  merged.categories = mergeById(local.categories, remote.categories);
  merged.coupons = mergeById(local.coupons, remote.coupons);
  merged.staff = mergeById(local.staff, remote.staff);
  merged.invItems = mergeById(local.invItems, remote.invItems);

  function unionById(a,b){
    const map = {};
    [...(a||[]), ...(b||[])].forEach(r=>{ map[r.id] = r; });
    return Object.values(map).sort((x,y)=> new Date(x.timestamp||x.closedAt) - new Date(y.timestamp||y.closedAt));
  }
  merged.sales = unionById(local.sales, remote.sales);
  merged.dayCloses = unionById(local.dayCloses, remote.dayCloses);
  merged.staffUsage = unionById(local.staffUsage, remote.staffUsage);
  merged.invMoves = unionById(local.invMoves, remote.invMoves);
  return merged;
}

async function pullFromDrive(silent){
  if(!navigator.onLine) return;
  try{
    const remote = await driveReadFile(state.dbFileId);
    state.db = migrateDb(mergeDb(state.db, remote));
    state.lastSyncAt = nowIso();
    applyTheme();
    saveLocalCache();
    autoBackup();
    if(!silent) render();
    else renderIfLive();
  }catch(e){ console.warn("pull failed", e); }
}

let pendingSave = null;
async function pushToDrive(){
  const fp = metaFp(state.db.meta);
  if(state.db.meta._fp === undefined){ state.db.meta._fp = fp; }
  else if(state.db.meta._fp !== fp){ state.db.meta._fp = fp; state.db.meta.updatedAt = nowIso(); }
  saveLocalCache();
  clearTimeout(pendingSave);
  pendingSave = setTimeout(async ()=>{
    if(!navigator.onLine){
      state.offlinePending = true;
      renderIfLive();
      return;
    }
    try{
      state.saving = true;
      await driveWriteFile(state.dbFileId, state.db);
      state.offlinePending = false;
      state.lastSyncAt = nowIso();
    }catch(e){
      console.warn("save failed", e);
      state.offlinePending = true;
    }finally{
      state.saving = false;
      renderIfLive();
    }
  }, 400);
}

async function flushOffline(){
  if(!state.dbFileId || !navigator.onLine) return;
  try{
    if(!state.accessToken){
      // no token in memory at all (device never connected, or it was cleared
      // because a previous call found it invalid) — nothing to retry
      // automatically; the sync pill routes to the connect screen instead.
      return;
    }
    const remote = await driveReadFile(state.dbFileId);
    state.db = migrateDb(mergeDb(state.db, remote));
    await driveWriteFile(state.dbFileId, state.db);
    state.offlinePending = false;
    state.lastSyncAt = nowIso();
    saveLocalCache();
    applyTheme();
    startSyncLoop();
    toast("Back online — synced", "ok");
    render();
  }catch(e){
    console.warn("flush failed", e);
    if(String(e.message||"").match(/40[13]/)){
      // the token no longer works (revoked/expired) — clear it so the
      // person is prompted to paste a fresh one, rather than retrying forever
      state.accessToken = null;
      clearSavedToken();
      renderIfLive();
    }
  }
}

function startSyncLoop(){
  clearInterval(state.syncTimer);
  state.syncTimer = setInterval(()=>{
    if(state.offlinePending || !state.accessToken) flushOffline();
    else pullFromDrive(true);
  }, CONFIG.SYNC_INTERVAL_MS);
}

/* re-render only if we're on a "live" screen, to avoid clobbering form input focus */
function renderIfLive(){
  if(["admin","developer","supervisor"].includes(state.view)) render();
  else if(state.view==="cashier"){
    // just refresh the sync pill without rebuilding the whole cart/typing state
    const pill = document.getElementById("syncPill");
    if(pill){ pill.outerHTML = syncPillHtml(); wireSyncPill(); }
  }
}
function syncPillHtml(){
  if(!state.accessToken){
    return `<span class="pill" id="syncPill" style="cursor:pointer; border-color:var(--copper);" title="This device is not connected"><span class="dot offline"></span>Tap to connect</span>`;
  }
  let cls, label, tip = "";
  if(!navigator.onLine){ cls = "offline"; label = "Offline — saved on this device"; }
  else if(state.offlinePending){ cls = "warn"; label = "Waiting to sync — tap to retry"; }
  else if(state.saving){ cls = "warn"; label = "Syncing…"; }
  else { cls = "live"; label = "Synced"; tip = state.lastSyncAt ? "Last sync " + fmtDateTime(state.lastSyncAt).slice(11) : ""; }
  return `<span class="pill" id="syncPill" style="cursor:pointer;" title="${tip}"><span class="dot ${cls}"></span>${label}</span>`;
}
function wireSyncPill(){
  const pill = document.getElementById("syncPill");
  if(!pill) return;
  if(!state.accessToken){
    pill.onclick = ()=>{ state.view = "connect"; render(); };
  } else if(state.offlinePending){
    pill.onclick = ()=> flushOffline();
  } else {
    pill.onclick = async ()=>{ await pullFromDrive(true); toast("Checked — everything is up to date", "ok"); };
  }
}

window.addEventListener("online", ()=>{ if(state.dbFileId) flushOffline(); });
window.addEventListener("offline", ()=>{
  state.offlinePending = true;
  toast("You're offline — sales keep working and will sync automatically", "err");
  renderIfLive();
});

/* ================= AUTO BACKUP =================
   A dated copy of the whole database is saved in the "backups" folder of the data repository:
   at most every 4 hours while the app is in use, and every time a day is closed.
   The last 30 days of backups are kept. To restore, copy a backup file over the database file on GitHub. */
const BACKUP_EVERY_MS = 4*60*60*1000, BACKUP_KEEP_DAYS = 30;
function backupUrl(path){ return `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${path}`; }
function backupKey(){ return "sade_last_backup_" + CONFIG.DB_FILENAME; }
function lastBackupAt(){ try{ return localStorage.getItem(backupKey()) || ""; }catch(e){ return ""; } }
let backupBusy = false;
async function autoBackup(force){
  if(backupBusy || !state.accessToken || !navigator.onLine || !state.db || !state.dbFileId) return false;
  const last = lastBackupAt();
  if(!force && last && Date.now() - new Date(last).getTime() < BACKUP_EVERY_MS) return false;
  backupBusy = true;
  try{
    const day = todayStr();
    const path = "backups/backup-" + day + ".json";
    let sha;
    const head = await fetch(backupUrl(path), { headers: authHeaders() });
    if(head.ok){ sha = (await head.json()).sha; }
    else if(head.status !== 404) throw new Error("backup check " + head.status);
    const body = { message: "Auto backup " + day, content: utf8ToBase64(JSON.stringify(state.db)) };
    if(sha) body.sha = sha;
    const put = await fetch(backupUrl(path), { method:"PUT", headers:{ ...authHeaders(), "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(!put.ok) throw new Error("backup write " + put.status);
    try{ localStorage.setItem(backupKey(), nowIso()); }catch(e){}
    if(!sha) pruneBackups();    // first backup of a new day: remove ones older than 30 days
    return true;
  }catch(e){
    console.warn("backup failed", e);
    return false;
  }finally{ backupBusy = false; }
}
async function pruneBackups(){
  try{
    const res = await fetch(backupUrl("backups"), { headers: authHeaders() });
    if(!res.ok) return;
    const files = await res.json();
    const cutoff = new Date(Date.now() - BACKUP_KEEP_DAYS*86400000).toISOString().slice(0,10);
    const old = files.filter(f=>/^backup-\d{4}-\d{2}-\d{2}\.json$/.test(f.name) && f.name.slice(7,17) < cutoff).slice(0,5);
    for(const f of old){
      await fetch(backupUrl("backups/" + f.name), { method:"DELETE", headers:{ ...authHeaders(), "Content-Type":"application/json" }, body: JSON.stringify({ message:"Remove old backup", sha:f.sha }) });
    }
  }catch(e){}
}

  const card = document.createElement("div");

  const last = lastBackupAt();
  card.innerHTML = `

    <p style="font-size:12.5px; color:var(--crema-dim); margin-bottom:10px;">A copy of all your data is saved automatically in the <b>backups</b> folder of the data repository (about every 4 hours while the app is in use, and whenever a day is closed). The last 30 days are kept.</p>

async function tryLogin(username, password){
  const hash = await sha256(password);
  const user = activeUsers().find(u => u.username.toLowerCase() === username.trim().toLowerCase() && u.active !== false);
  if(!user || user.passwordHash !== hash) return null;
  return user;
}

/* saved access token lives in its own localStorage key, separate from the
   app-data cache, so it survives independently and is never written into
   the synced database itself */
function saveToken(pat){ try{ localStorage.setItem("sade_gh_pat", pat); }catch(e){} }
function loadSavedToken(){ try{ return localStorage.getItem("sade_gh_pat"); }catch(e){ return null; } }
function clearSavedToken(){ try{ localStorage.removeItem("sade_gh_pat"); }catch(e){} }

/* ================= INIT / BOOTSTRAP ================= */

async function init(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  // best-effort native orientation lock (only works in fullscreen/installed
  // contexts on some browsers) — the CSS rotate overlay is the real fallback
  if(screen.orientation && screen.orientation.lock){
    screen.orientation.lock("landscape").catch(()=>{});
  }
  if(CONFIG.GITHUB_OWNER.includes("YOUR_") || CONFIG.GITHUB_REPO.includes("YOUR_")){
    state.view = "setup";
    render();
    return;
  }

  const savedToken = loadSavedToken();
  if(savedToken) state.accessToken = savedToken;

  // If this device has synced before, boot straight into the app from the
  // local cache — no network required — so the PWA is usable offline from a
  // cold start, not just mid-session.
  const cached = loadLocalCache();
  if(cached && cached.db){
    state.dbFileId = cached.dbFileId;
    state.db = migrateDb(cached.db);
    applyTheme();
    state.view = "login";
    render();
    if(state.accessToken) flushOffline();
    return;
  }

  state.view = "connect";
  render();
}

async function seedDefaultDbUsers(db){
  const hash = await sha256("developer123");
  db.users.push({
    id: uid(), username:"developer", passwordHash: hash, role:"developer",
    name:"Developer", active:true, createdAt: nowIso(), updatedAt: nowIso()
  });

async function handleConnect(){
  const patInput = document.getElementById("patInput");
  const pat = (patInput ? patInput.value.trim() : "") || state.accessToken;
  if(!pat){ toast("Paste your access token first", "err"); return; }
  state.accessToken = pat;
  try{
    await connectDrive();
    saveToken(pat);
    toast("Connected", "ok");
    let file = await driveFindDbFile();
    if(!file){
      const fresh = defaultDb();
      await seedDefaultDbUsers(fresh);
      const id = await driveCreateDbFile(fresh);
      state.dbFileId = id;
      state.db = migrateDb(fresh);
      toast("Created new database", "ok");
      await pushToDrive();
    } else {
      state.dbFileId = file.id;
      state.db = migrateDb(await driveReadFile(file.id));
      if(!state.db.users || state.db.users.length===0){
        await seedDefaultDbUsers(state.db);
      }
      await pushToDrive();
    }
    applyTheme();
    saveLocalCache();
    startSyncLoop();
    state.lastSyncAt = nowIso();
    autoBackup();
    state.view = "login";
    render();
  }catch(e){
    console.error(e);
    toast("Could not connect — " + ((e && e.message) || "check your token, repository name, and permissions") + ".", "err");
  }
}

/* ================= CATEGORY / PRODUCT / USER / COUPON HELPERS =================
   Deleting a record can't just remove it from the local array — a device that
   hasn't synced the deletion yet would "resurrect" it on its next merge, since
   the merge logic only knows how to combine records, not represent an absence.
   So a delete instead soft-deletes (deleted:true + updatedAt), and every read
   site filters those out — the tombstone itself still syncs like any edit. */
function categoriesSorted(){
  return (state.db.categories||[]).filter(c=>!c.deleted).slice().sort((a,b)=>(a.order??0)-(b.order??0));
}
function sortedProducts(){
  return state.db.products.filter(p=>!p.deleted).slice().sort((a,b)=> (a.order??0) - (b.order??0));
}
function activeUsers(){
  return (state.db.users||[]).filter(u=>!u.deleted);
}
function activeCoupons(){
  return (state.db.coupons||[]).filter(c=>!c.deleted);
}
/* everything worth showing in the Coupons tab: active, disabled, AND used
   (single-use tombstones) — but not a code the developer truly deleted,
   which stays fully hidden the way a delete normally would. */
function visibleCoupons(){
  return (state.db.coupons||[]).filter(c=>!c.deleted || c.usedInSale);
}
function couponStatus(c){
  if(c.usedInSale) return { label:"Used", color:"var(--crema-dim)" };
  if(c.active===false) return { label:"Disabled", color:"var(--err)" };
  return { label:"Active", color:"var(--ok)" };
}
function categoryName(catId){

/* coupon rule: applies to ONE unit only, of the highest-priced eligible
   ("drink") item in the cart — never multiplied across quantity or items,
   and never applied to non-drink items. */
function computeCartTotals(cart, coupon, staffRef){
  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
  let discountAmt = 0;
  if(coupon && !staffRef){
    const eligiblePrices = cart.filter(i=>i.isDrink!==false).map(i=>i.price);
    if(eligiblePrices.length){
      const maxPrice = Math.max(...eligiblePrices);
      discountAmt = maxPrice * (coupon.percent/100);
    }
  }
  const staff = computeStaffDiscount(cart, staffRef);
  const total = Math.max(0, subtotal - discountAmt - staff.amount);
  return { subtotal, discountAmt, staffDiscountAmt: staff.amount, staffUnits: { drink: staff.drink, food: staff.food }, total };
}

/* ---- cart lines with optional add-ons ---- */
function productOptionGroups(p){
  return ((p && p.optionGroups) || []).filter(g=>g.choices && g.choices.length);
}
function optLinesHtml(item){
  if(!item.options || !item.options.length) return "";
  const labels = [];
  item.options.forEach(o=>o.choices.forEach(c=>labels.push(esc(c.label))));
  return labels.length ? `<div class="ci-opts">${labels.join(" · ")}</div>` : "";
}
function receiptOptLines(item){
  if(!item.options || !item.options.length) return "";
  return item.options.map(o=>o.choices.map(c=>
    `<div class="rsub">– ${esc(c.label)}${c.price>0 ? " (+"+moneyText(c.price)+")" : ""}</div>`).join("")).join("");
}
/* adds a line to the cart. Identical product + identical add-ons merge into one line (qty+1);
   open-price lines are always their own line, as before. */
function pushCartLine(productId, name, basePrice, isDrink, options, openPrice){
  const prob = checkCartStock(state.cart.concat([{ productId, qty:1, options }]));
  if(prob){ stockToast(prob, name); return false; }
  const extra = options.reduce((s,o)=>s+o.choices.reduce((a,c)=>a+(c.price||0),0),0);
  const price = basePrice + extra;
  const key = openPrice ? uid() : (productId + "|" + price + "|" +
    options.map(o=>o.groupId+":"+o.choices.map(c=>c.id).sort().join(",")).join(";"));
  const existing = openPrice ? null : state.cart.find(i=>i.key===key);
  if(existing) existing.qty++;
  else state.cart.push({ key, productId, name, price, qty:1, isDrink, options });
}

function addToCart(product){
  if(product.price===null || product.price===undefined){
    // open price — hand off to the always-on numpad panel instead of adding directly
    state.numpadTarget = { kind:"product", id: product.id, name: product.name, isDrink: product.isDrink!==false };
    state.numpadAmount = "";
    render();
    const panel = document.getElementById("numpadPanel");
    if(panel) panel.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  const pre = checkCartStock(state.cart.concat([{ productId: product.id, qty:1, options:[] }]));
  if(pre){ stockToast(pre, product.name); return; }
  const groups = productOptionGroups(product);
  if(!groups.length){
    pushCartLine(product.id, product.name, product.price, product.isDrink!==false, [], false);
    render();
    return;
  }
  openOptionsModal(product, groups, product.price, opts=>{
    pushCartLine(product.id, product.name, product.price, product.isDrink!==false, opts, false);
    render();
  });
}

/* popup shown when a product has add-on options: radio groups (pick one) and checkbox groups (pick any) */
function openOptionsModal(product, groups, basePrice, onConfirm){
  const isReq = g => g.type==="radio" ? g.required!==false : g.required===true;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${esc(product.name)}</h3>
      ${groups.map(g=>`
        <div class="opt-group">
          <h4>${esc(g.title)}<small>${g.type==="radio" ? "choose one" : "choose any"}${isReq(g) ? " · required" : ""}</small></h4>
          ${g.choices.map(c=>`
            <label class="opt-choice">
              <input type="${g.type==="radio" ? "radio" : "checkbox"}" name="og_${g.id}" data-g="${g.id}" data-c="${c.id}" ${choiceOut(c) ? "disabled" : ""} />
              <span>${esc(c.label)}${choiceOut(c) ? " · sold out" : ""}</span>
              ${c.price>0 ? `<span class="opt-extra">+${moneyText(c.price)}</span>` : ""}
            </label>`).join("")}
        </div>`).join("")}
      <div class="modal-actions">
        <button class="btn btn-outline" id="ogCancel">Cancel</button>
        <button class="btn btn-primary" id="ogOk">Add</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const okBtn = bg.querySelector("#ogOk");
  function selection(){
    return groups.map(g=>({
      g, picked: g.choices.filter(c=>bg.querySelector(`input[data-g="${g.id}"][data-c="${c.id}"]`).checked)
    }));
  }
  function refresh(){
    const sel = selection();
    const ok = sel.every(s=> !isReq(s.g) || s.picked.length>0);
    const extra = sel.reduce((t,s)=>t+s.picked.reduce((a,c)=>a+(c.price||0),0),0);
    okBtn.disabled = !ok;
    okBtn.textContent = "Add — " + moneyText(basePrice + extra);
  }
  bg.addEventListener("change", refresh);
  refresh();
  bg.querySelector("#ogCancel").onclick = ()=>bg.remove();
  okBtn.onclick = ()=>{
    const opts = selection().filter(s=>s.picked.length).map(s=>({
      groupId: s.g.id, title: s.g.title,
      choices: s.picked.map(c=>({ id:c.id, label:c.label, price:c.price||0, inv:c.invUse||[] }))
    }));
    bg.remove();
    onConfirm(opts);
  };
}

/* ---- always-visible numpad panel (not a modal) ----
   Locked/idle until the cashier either taps an open-price item (prices it)
   or taps "Enter coupon code" (types a code) — it never accepts digits on
   its own and there is no freeform "custom item" entry point anymore. */
function renderNumpadPanel(host){
  if(!host) return;
  const target = state.numpadTarget;
  const locked = !target;
  let headerHtml, displayHtml, btnLabel;
  if(!target){
    headerHtml = `<div class="numpad-target"><span>Tap an item with no price, or "Enter coupon code", to begin.</span></div>`;
    displayHtml = `—`;
    btnLabel = "Add to cart";
  } else if(target.kind==="coupon"){
    headerHtml = `<div class="numpad-target"><span>Entering <b>coupon code</b></span><a id="npClearTarget">Cancel</a></div>`;
    displayHtml = state.numpadAmount || "0";
    btnLabel = "Apply coupon";
  } else {
    headerHtml = `<div class="numpad-target"><span>Entering price for <b>${target.name}</b></span><a id="npClearTarget">Cancel</a></div>`;
    displayHtml = money(parseFloat(state.numpadAmount||"0"));
    btnLabel = "Add to cart";
  }
  host.innerHTML = `
    <div class="numpad-panel" id="numpadPanel">
      ${headerHtml}
      <div class="numpad-display" id="npDisplay">${displayHtml}</div>
      <div class="numpad-grid" id="npGrid"></div>
      <button class="btn btn-primary btn-block" id="npAddBtn" ${locked?"disabled":""}>${btnLabel}</button>
    </div>`;
  const grid = host.querySelector("#npGrid");
  const keys = ["1","2","3","4","5","6","7","8","9",".","0","⌫"];
  keys.forEach(k=>{
    const b = document.createElement("button");
    b.textContent = k;
    b.disabled = locked || (k==="." && target && target.kind==="coupon"); // coupon codes are numeric-only
    b.onclick = ()=>{
      if(locked) return;
      if(k==="⌫") state.numpadAmount = state.numpadAmount.slice(0,-1);
      else if(k==="." && state.numpadAmount.includes(".")) {}
      else state.numpadAmount += k;
      const disp = host.querySelector("#npDisplay");
      if(target && target.kind==="coupon") disp.textContent = state.numpadAmount || "0";
      else disp.innerHTML = money(parseFloat(state.numpadAmount||"0"));
    };
    grid.appendChild(b);
  });
  const clearTarget = host.querySelector("#npClearTarget");
  if(clearTarget) clearTarget.onclick = ()=>{ state.numpadTarget = null; state.numpadAmount=""; render(); };
  host.querySelector("#npAddBtn").onclick = ()=>{
    if(locked) return;
    if(target.kind==="coupon"){
      if(currentStaff()){ toast("Coupons can't be combined with a staff order","err"); return; }
      const code = state.numpadAmount.trim();
      if(!code){ toast("Enter a code first", "err"); return; }
      const match = activeCoupons().find(c => c.code.toUpperCase()===code.toUpperCase() && c.active!==false);
      if(!match){ toast("Coupon not found or inactive", "err"); return; }
      state.appliedCoupon = { code: match.code, percent: match.percent };
      state.numpadAmount = ""; state.numpadTarget = null;
      render();
      return;
    }
    const price = parseFloat(state.numpadAmount);
    if(isNaN(price) || price<=0){ toast("Enter an amount first", "err"); return; }
    // drink eligibility comes from how the developer set up this product — cashiers never choose it
    const tgt = target;
    const prod = state.db.products.find(p=>p.id===tgt.id);
    const groups = productOptionGroups(prod);
    state.numpadAmount = ""; state.numpadTarget = null;
    if(!groups.length){
      pushCartLine(tgt.id, tgt.name, price, tgt.isDrink!==false, [], true);
      render();
    } else {
      render();
      openOptionsModal(prod, groups, price, opts=>{
        pushCartLine(tgt.id, tgt.name, price, tgt.isDrink!==false, opts, true);
        render();
      });
    }
  };
}

/* Shop-wide daily receipt number: counts every sale already recorded today
   by ANY cashier and adds one, zero-padded to 3 digits. It's derived from
   the sales themselves rather than kept as a separate counter, so it resets
   on its own when the date changes, is unaffected by a cashier closing
   their day or by who's signed in, and needs no extra state to sync. (If two
   devices finish a sale inside the same ~20s sync window they could compute
   the same number — a small, accepted trade-off at one shop's volume.) */
function nextReceiptNumber(db){
  const todayCount = (db || state.db).sales.filter(s=>s.date===todayStr()).length;
  return String(todayCount + 1).padStart(3, "0");
}

/* Puts the current order into `db` (a sale record, staff-allowance usage, coupon use) and returns the sale. */
function applyOrderToDb(db, totals){
  const sale = {
    id: uid(),
    receiptNumber: nextReceiptNumber(db),
    cashierId: state.currentUser.id,
    cashierName: state.currentUser.name || state.currentUser.username,
    items: state.cart.map(i=>({productId:i.productId, name:i.name, price:i.price, qty:i.qty, isDrink:i.isDrink!==false, options:i.options||[]})),
    subtotal: totals.subtotal,
    couponCode: state.appliedCoupon ? state.appliedCoupon.code : null,
    discountPercent: state.appliedCoupon ? state.appliedCoupon.percent : 0,
    discountAmt: totals.discountAmt,
    staffDiscountAmt: totals.staffDiscountAmt || 0,
    staffId: (totals.staffDiscountAmt>0 && state.staffMember) ? state.staffMember.id : null,
    total: totals.total,
    inv: invForSale(),
    payment: state.payMethod,
    timestamp: nowIso(),
    date: todayStr()
  };
  db.sales.push(sale);
  // use up the staff allowance (hidden from cashiers — only the developer sets it)
  if(currentStaff()){
    ["drink","food"].forEach(kind=>{
      const q = totals.staffUnits[kind];
      if(q>0) db.staffUsage.push({ id: uid(), staffId: state.staffMember.id, kind, qty:q, saleId: sale.id, timestamp: nowIso(), date: todayStr() });
    });
  }
  // coupons are single-use — mark it used the moment it's actually applied
  // in a completed sale. This is a distinct flag from a manual "Delete" so
  // the Coupons tab can show "Used" as its own status rather than just
  // vanishing the same way a developer-deleted code does.
  if(state.appliedCoupon && totals.discountAmt > 0){
    const used = db.coupons.find(c => c.code.toUpperCase() === state.appliedCoupon.code.toUpperCase());
    if(used){ used.deleted = true; used.active = false; used.usedInSale = true; used.updatedAt = nowIso(); }
  }
  return sale;
}

async function completeSale(){
  if(state.cart.length===0) return;
  const totals = computeCartTotals(state.cart, state.appliedCoupon, currentStaff());
  const sale = applyOrderToDb(state.db, totals);
  state.cart = [];
  state.appliedCoupon = null;
  state.staffMember = null;
  await pushToDrive();
  render();
  if(state.db.meta.autoPrintReceipt !== false){
    // auto-print on: the print dialog is the only thing that opens — no
    // second on-screen "Sale complete" popup on top of it.
    toast(`Sale complete — receipt ${sale.receiptNumber}`, "ok");
    printHTML(`<div class="receipt">${receiptInnerHtml(sale)}</div>`, state.db.meta.printCopies);
  } else {
    // auto-print off: show the receipt on screen so it can still be printed by hand
    showReceiptModal(sale);
  }
}

function showReceiptModal(sale){

        <button class="btn btn-primary btn-block" id="printReceiptBtn">🖨️ Print</button>
      </div>
    </div>`;

  $("#printReceiptBtn").onclick = ()=> printHTML(`<div class="receipt">${receiptInnerHtml(sale)}</div>`, state.db.meta.printCopies);
}

function receiptInnerHtml(sale){
  const rows = `
    ${sale.receiptNumber ? `<div class="rline rnum" style="font-weight:700;"><span>Receipt No.</span><span class="num">${sale.receiptNumber}</span></div>` : ""}
    <div class="rline"><span>${fmtDateTime(sale.timestamp)}</span><span>${sale.cashierName}</span></div>
    <hr/>
    ${sale.items.map(i=>`<div class="rline"><span>${i.qty}× ${i.name}</span><span>${money(i.price*i.qty)}</span></div>${receiptOptLines(i)}`).join("")}
    <hr/>
    <div class="rline"><span>Subtotal</span><span>${money(sale.subtotal!=null?sale.subtotal:sale.total)}</span></div>

    ${sale.staffDiscountAmt ? `<div class="rline"><span>Discount</span><span>−${money(sale.staffDiscountAmt)}</span></div>` : ""}

    <div class="rline"><span>Payment</span><span style="text-transform:capitalize;">${sale.payment}</span></div>`;
  return receiptWrap(rows);
}

function reprintLastReceipt(){
  const mine = state.db.sales.filter(s=>s.cashierId===state.currentUser.id)
    .sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  const sale = mine[mine.length-1];

  printHTML(`<div class="receipt"><div style="text-align:center;font-size:11px;font-weight:700;">*** REPRINT ***</div>${receiptInnerHtml(sale)}</div>`, 1);
}

function openCloseDayModal(){
  const todaySales = state.db.sales.filter(s=>s.cashierId===state.currentUser.id && s.date===todayStr());
  const total = todaySales.reduce((s,x)=>s+x.total,0);
  const cash = todaySales.filter(s=>s.payment==="cash").reduce((s,x)=>s+x.total,0);
  const card = todaySales.filter(s=>s.payment==="card").reduce((s,x)=>s+x.total,0);
  const byProduct = {};
  todaySales.forEach(s=>s.items.forEach(it=>{
    byProduct[it.name] = (byProduct[it.name]||0) + it.qty;
  }));
  const couponsUsed = todaySales.filter(s=>s.couponCode && s.discountAmt>0)
    .map(s=>({ code:s.couponCode, percent:s.discountPercent, discountAmt:s.discountAmt }));
  const couponsDiscountTotal = couponsUsed.reduce((s,c)=>s+c.discountAmt,0);
  const reportRows = `
    <div class="rline"><span>Cashier</span><span>${state.currentUser.name||state.currentUser.username}</span></div>
    <div class="rline"><span>Date</span><span>${fmtDate(todayStr())}</span></div>
    <hr/>

function addDaysStr(ds, n){ const d = new Date(ds + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function analyticsRange(st){
  const t = todayStr();
  if(st.preset==="yesterday") return [addDaysStr(t,-1), addDaysStr(t,-1)];
  if(st.preset==="week") return [addDaysStr(t,-6), t];
  if(st.preset==="month") return [t.slice(0,8)+"01", t];
  if(st.preset==="custom") return [st.from <= st.to ? st.from : st.to, st.from <= st.to ? st.to : st.from];
  return [t, t];
}
function computeAnalytics(from, to){
  const sales = state.db.sales.filter(s=>s.date>=from && s.date<=to);
  const out = { sales, revenue:0, discounts:0, byProduct:{}, byHour:{}, byCashier:{}, byPay:{} };
  sales.forEach(s=>{
    out.revenue += s.total || 0;
    out.discounts += (s.discountAmt||0) + (s.staffDiscountAmt||0);
    (s.items||[]).forEach(i=>{
      const p = out.byProduct[i.name] = out.byProduct[i.name] || { qty:0, rev:0 };
      p.qty += i.qty; p.rev += i.price * i.qty;
    });
    const h = new Date(s.timestamp).getHours();
    const hh = out.byHour[h] = out.byHour[h] || { n:0, rev:0 };
    hh.n++; hh.rev += s.total || 0;
    const c = out.byCashier[s.cashierName] = out.byCashier[s.cashierName] || { n:0, rev:0 };
    c.n++; c.rev += s.total || 0;
    const pm = s.payment || "other";
    const pp = out.byPay[pm] = out.byPay[pm] || { n:0, rev:0 };
    pp.n++; pp.rev += s.total || 0;
  });
  return out;
}
function staffUsageRows(from, to){
  const usage = (state.db.staffUsage||[]).filter(u=>u.date>=from && u.date<=to);
  const sales = state.db.sales.filter(s=>s.date>=from && s.date<=to && s.staffId);
  const per = { drinkLabel:"drinks" };
  return allStaff().map(s=>{
    const drinks = usage.filter(u=>u.staffId===s.id && u.kind==="drink").reduce((t,u)=>t+(u.qty||0),0);
    const food = usage.filter(u=>u.staffId===s.id && u.kind==="food").reduce((t,u)=>t+(u.qty||0),0);
    const value = sales.filter(x=>x.staffId===s.id).reduce((t,x)=>t+(x.staffDiscountAmt||0),0);
    return { staff:s, drinks, food, value };
  });
}

/* One report per day. It is built from ALL sales of that date, so every cashier is included — even one
   who did not press "Close day". Cashiers are listed in the order they started (first sale of the day). */
function dailyReportFor(date, closes){
  const per = {};
  state.db.sales.filter(s=>s.date===date).forEach(s=>{
    const k = s.cashierId || s.cashierName;
    const c = per[k] = per[k] || { key:k, name:s.cashierName, start:s.timestamp, transactionCount:0, cash:0, card:0, total:0,
                                    couponsUsed:[], couponsDiscountTotal:0, byProduct:{}, closedAt:null };
    if(s.timestamp < c.start) c.start = s.timestamp;
    c.transactionCount++; c.total += s.total || 0;
    if(s.payment==="cash") c.cash += s.total || 0;
    else if(s.payment==="card") c.card += s.total || 0;
    if(s.couponCode && s.discountAmt>0){
      c.couponsUsed.push({ code:s.couponCode, percent:s.discountPercent, discountAmt:s.discountAmt });
      c.couponsDiscountTotal += s.discountAmt;
    }
    (s.items||[]).forEach(i=>{ c.byProduct[i.name] = (c.byProduct[i.name]||0) + i.qty; });
  });
  // a cashier who closed but has no sales that day (e.g. a 0-transaction close) still appears, from their closing
  const latest = {};
  closes.forEach(c=>{
    const k = c.cashierId || c.cashierName;
    if(!latest[k] || new Date(c.closedAt) > new Date(latest[k].closedAt)) latest[k] = c;
  });
  Object.keys(latest).forEach(k=>{
    const c = latest[k];
    if(per[k]){ per[k].closedAt = c.closedAt; return; }
    const b = c.breakdown || {};
    per[k] = { key:k, name:c.cashierName, start:c.closedAt, transactionCount:c.transactionCount||0, cash:b.cash||0, card:b.card||0,
               total:c.totalSales||0, couponsUsed:b.couponsUsed||[], couponsDiscountTotal:b.couponsDiscountTotal||0,
               byProduct:{ ...(b.byProduct||{}) }, closedAt:c.closedAt };
  });
  const rows = Object.values(per).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
  const r = { date, rows, cashiers: rows.map(x=>x.name), transactionCount:0, cash:0, card:0, total:0,
              couponsUsed:[], couponsDiscountTotal:0, byProduct:{} };
  rows.forEach(c=>{
    r.transactionCount += c.transactionCount; r.cash += c.cash; r.card += c.card; r.total += c.total;
    r.couponsUsed = r.couponsUsed.concat(c.couponsUsed); r.couponsDiscountTotal += c.couponsDiscountTotal;
    Object.entries(c.byProduct).forEach(([n,q])=>{ r.byProduct[n] = (r.byProduct[n]||0) + q; });
  });
  return r;
}
function buildDailyReports(){
  const byDate = {};
  (state.db.dayCloses||[]).forEach(c=>{ (byDate[c.date] = byDate[c.date] || []).push(c); });
  return Object.keys(byDate).sort().reverse().map(date=>dailyReportFor(date, byDate[date]));
}

function printDailyReport(r){
  const perCashier = r.rows.map(c=>`<div class="rline"><span>${esc(c.name)} (${c.transactionCount})</span><span>${money(c.total)}</span></div>`).join("");
  const rows = `
    <div class="rline"><span>Date</span><span>${fmtDate(r.date)}</span></div>
    <div class="rline"><span>Cashiers</span><span>${r.rows.length}</span></div>
    ${perCashier}
    <hr/>
    <div class="rline"><span>Transactions</span><span>${r.transactionCount}</span></div>
    <div class="rline"><span>Cash</span><span>${money(r.cash)}</span></div>
    <div class="rline"><span>Card</span><span>${money(r.card)}</span></div>
    <hr/>
    ${Object.entries(r.byProduct).map(([n,q])=>`<div class="rline"><span>${esc(n)}</span><span>x${q}</span></div>`).join("")}
    ${r.couponsUsed.length ? `<hr/><div class="rline"><span>Coupons used</span><span>${r.couponsUsed.length}</span></div>${r.couponsUsed.map(cu=>`<div class="rline"><span>&nbsp;&nbsp;${esc(cu.code)} (${cu.percent}%)</span><span>−${money(cu.discountAmt)}</span></div>`).join("")}<div class="rline"><span>Total discount given</span><span>−${money(r.couponsDiscountTotal)}</span></div>` : ""}
    <hr/>
    <div class="rline" style="font-weight:700;"><span>TOTAL</span><span>${money(r.total)}</span></div>`;
  printHTML(`<div class="receipt">${receiptWrap(rows)}</div>`);
}
