function openUserModal(user){
  const isNew = !user;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "Add team member" : "Edit team member"}</h3>
      <div class="field"><label>Full name</label><input id="ufName" value="${user?user.name:""}" /></div>
      <div class="field"><label>Username</label><input id="ufUser" value="${user?user.username:""}" ${user?"disabled":""} /></div>
      <div class="field"><label>Role</label>
        <select id="ufRole">
          <option value="cashier" ${user&&user.role==='cashier'?'selected':''}>${roleLabel('cashier')}</option>
          <option value="admin" ${user&&user.role==='admin'?'selected':''}>${roleLabel('admin')}</option>
        </select>
      </div>
      <div class="field"><label>${isNew?"Password":"New password (leave blank to keep current)"}</label><input id="ufPass" type="password" /></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="ufActive" style="width:auto;" ${user.active!==false?"checked":""}/> Account active</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="delUser">Remove</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelUser">Cancel</button>
        <button class="btn btn-primary" id="saveUser">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#cancelUser").onclick = ()=>bg.remove();
  $("#saveUser").onclick = async ()=>{
    const name = $("#ufName").value.trim();
    const username = $("#ufUser").value.trim();
    const role = $("#ufRole").value;
    const pass = $("#ufPass").value;
    if(!name || !username){ toast("Name and username are required","err"); return; }
    if(isNew){
      if(activeUsers().some(u=>u.username.toLowerCase()===username.toLowerCase())){
        toast("Username already exists","err"); return;
      }
      if(!pass){ toast("Password is required","err"); return; }
      const hash = await sha256(pass);
      state.db.users.push({ id: uid(), username, passwordHash: hash, role, name, active:true, createdAt: nowIso(), updatedAt: nowIso() });
    } else {
      user.name = name; user.role = role; user.updatedAt = nowIso();
      user.active = $("#ufActive").checked;
      if(pass) user.passwordHash = await sha256(pass);
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew){
    $("#delUser").onclick = async ()=>{
      user.deleted = true; user.active = false; user.updatedAt = nowIso();
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ================= SETTINGS (branding, currency, receipt, colors) ================= */
function renderSettingsPanel(el){
  const m = state.db.meta;
  const draft = { ...m, theme: { ...(m.theme||DEFAULT_THEME) }, layout: { ...(m.layout||DEFAULT_LAYOUT) } };
  const isPreset = CURRENCY_PRESETS.some(c=>c.symbol===m.currencySymbol && c.code===m.currencyCode);

  el.innerHTML = `
    <div class="card">
      <div class="settings-section">
        <h4>Branding</h4>
        <div class="field"><label>Business name</label><input id="stName" value="${m.businessName||""}" /></div>
        <div class="logo-row">
          <div id="logoPreviewWrap">${m.logoDataUrl ? `<img class="logo-preview" id="logoPreview" src="${m.logoDataUrl}"/>` : `<div class="logo-preview empty" id="logoPreview">No logo</div>`}</div>
          <div style="flex:1;">
            <input type="file" id="stLogo" accept="image/*" />
            <a class="link" id="removeLogo" style="display:${m.logoDataUrl?'inline':'none'}; margin-top:6px;">Remove logo</a>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h4>Currency</h4>
        <div class="inline-row">
          <div class="field"><label>Preset</label>
            <select id="stCurrencyPreset">
              ${CURRENCY_PRESETS.map(c=>`<option value="${c.code}" ${m.currencyCode===c.code?"selected":""}>${c.code==="CUSTOM"?"Custom symbol":c.code==="TRY"?"TRY (tl)":c.code+" ("+c.symbol+")"}</option>`).join("")}
            </select>
          </div>
          <div class="field" id="customSymbolField" style="display:${m.currencyCode==='CUSTOM'?'block':'none'};"><label>Symbol</label><input id="stCustomSymbol" value="${m.currencyCode==='CUSTOM'?m.currencySymbol:''}" maxlength="4" /></div>
        </div>
      </div>

      <div class="settings-section">
        <h4>Receipts &amp; reports</h4>
        <div class="field"><label>Header text (address, phone — shown under the logo)</label><textarea id="stHeader">${m.receiptHeader||""}</textarea></div>
        <div class="field"><label>Footer text (shown at the bottom)</label><textarea id="stFooter">${m.receiptFooter||"Thank you!"}</textarea></div>
        <div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="stAutoPrint" style="width:auto;" ${m.autoPrintReceipt!==false?"checked":""}/> Automatically print a receipt after every sale</label></div>
      </div>

      <div class="settings-section">
        <h4>Theme</h4>
        <div style="display:flex; gap:10px; margin-bottom:14px;">
          <button class="btn btn-outline" id="themeLightBtn" style="flex:1;">☀️ Light</button>
          <button class="btn btn-outline" id="themeDarkBtn" style="flex:1;">🌙 Dark</button>
        </div>
        <p style="font-size:12px; color:var(--crema-dim); margin-bottom:10px;">Pick a starting point, then fine-tune individual colors below if you like.</p>
        <div class="theme-grid" id="themeGrid"></div>
      </div>

      <div class="settings-section">
        <h4>Panel sizes</h4>
        <p style="font-size:12px; color:var(--crema-dim); margin-bottom:10px;">Adjust how much room the numpad and order panels take up on the cashier screen.</p>
        <div class="field"><label>Numpad width: <span id="lv_numpadWidth">${draft.layout.numpadWidth}</span>px</label><input type="range" id="ls_numpadWidth" min="220" max="420" value="${draft.layout.numpadWidth}" /></div>
        <div class="field"><label>Order panel width: <span id="lv_cartWidth">${draft.layout.cartWidth}</span>px</label><input type="range" id="ls_cartWidth" min="280" max="480" value="${draft.layout.cartWidth}" /></div>
      </div>

      <div class="settings-section">
        <h4>Role names</h4>
        <p style="font-size:12px; color:var(--crema-dim); margin-bottom:10px;">Rename how these two roles appear throughout the app — the underlying permissions don't change.</p>
        <div class="inline-row">
          <div class="field"><label>"Cashier" is called</label><input id="stCashierLabel" value="${(m.roleLabels&&m.roleLabels.cashier)||'Cashier'}" /></div>
          <div class="field"><label>"Admin" is called</label><input id="stAdminLabel" value="${(m.roleLabels&&m.roleLabels.admin)||'Admin'}" /></div>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="saveSettingsBtn">Save settings</button>
    </div>`;

  const fieldLabels = { bg:"Background", bg2:"Panels / cards", accent:"Accent (buttons)", accentLight:"Accent — hover", text:"Text color" };
  const grid = $("#themeGrid");
  function renderThemeGrid(){
    grid.innerHTML = "";
    Object.keys(fieldLabels).forEach(key=>{
      const val = draft.theme[key];
      const row = document.createElement("div");
      row.className = "theme-swatch-field";
      row.innerHTML = `<input type="color" id="tf_${key}" value="${val}" />
        <div style="flex:1;"><div class="tlabel">${fieldLabels[key]}</div><div class="tval" id="tv_${key}">${val}</div></div>`;
      grid.appendChild(row);
      row.querySelector("input").addEventListener("input", e=>{
        draft.theme[key] = e.target.value;
        $("#tv_"+key).textContent = e.target.value;
        applyThemeDraft(draft.theme);
      });
    });
  }
  renderThemeGrid();

  $("#themeLightBtn").onclick = ()=>{
    draft.theme = { ...LIGHT_THEME };
    applyThemeDraft(draft.theme);
    renderThemeGrid();
  };
  $("#themeDarkBtn").onclick = ()=>{
    draft.theme = { ...DARK_THEME };
    applyThemeDraft(draft.theme);
    renderThemeGrid();
  };

  $("#stCurrencyPreset").onchange = e=>{
    $("#customSymbolField").style.display = e.target.value==="CUSTOM" ? "block" : "none";
  };

  ["numpadWidth","cartWidth"].forEach(key=>{
    $("#ls_"+key).addEventListener("input", e=>{
      draft.layout[key] = parseInt(e.target.value,10);
      $("#lv_"+key).textContent = e.target.value;
      applyLayoutDraft(draft.layout);
    });
  });

  $("#stLogo").addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      draft.logoDataUrl = reader.result;
      const wrap = $("#logoPreviewWrap");
      wrap.innerHTML = `<img class="logo-preview" id="logoPreview" src="${reader.result}"/>`;
      $("#removeLogo").style.display = "inline";
    };
    reader.readAsDataURL(file);
  });
  $("#removeLogo").onclick = ()=>{
    draft.logoDataUrl = null;
    $("#logoPreviewWrap").innerHTML = `<div class="logo-preview empty" id="logoPreview">No logo</div>`;
    $("#removeLogo").style.display = "none";
  };

  $("#saveSettingsBtn").onclick = async ()=>{
    draft.businessName = $("#stName").value.trim() || "Sade Coffee";
    const presetCode = $("#stCurrencyPreset").value;
    if(presetCode==="CUSTOM"){
      draft.currencyCode = "CUSTOM";
      draft.currencySymbol = $("#stCustomSymbol").value.trim() || "$";
    } else {
      const preset = CURRENCY_PRESETS.find(c=>c.code===presetCode);
      draft.currencyCode = preset.code;
      draft.currencySymbol = preset.symbol;
    }
    draft.receiptHeader = $("#stHeader").value;
    draft.receiptFooter = $("#stFooter").value.trim() || "Thank you!";
    draft.autoPrintReceipt = $("#stAutoPrint").checked;
    draft.roleLabels = {
      cashier: $("#stCashierLabel").value.trim() || "Cashier",
      admin: $("#stAdminLabel").value.trim() || "Admin"
    };
    state.db.meta = { ...state.db.meta, ...draft };
    applyTheme();
    await pushToDrive();
    toast("Settings saved", "ok");
    render();
  };
}

/* ================= DEVELOPER VIEW ================= */
function renderDeveloperView(el){
  const toggleWrap = document.createElement("div");
  toggleWrap.className = "banner " + (state.db.meta.appActive ? "" : "err");
  toggleWrap.style.display = "flex";
  toggleWrap.style.justifyContent = "space-between";
  toggleWrap.style.alignItems = "center";
  toggleWrap.style.border = "1px solid var(--line)";
  toggleWrap.style.background = "var(--espresso-2)";
  toggleWrap.innerHTML = `
    <div>
      <b>Main system ${state.db.meta.appActive ? "is active" : "is deactivated"}</b>
      <div style="font-size:12px; color:var(--crema-dim); margin-top:2px;">Clones on cashier devices sync automatically and follow this switch.</div>
    </div>
    <button class="btn ${state.db.meta.appActive ? 'btn-danger':'btn-primary'}" id="toggleActive">${state.db.meta.appActive ? "Deactivate" : "Activate"}</button>
  `;
  el.appendChild(toggleWrap);
  el.appendChild(document.createElement("div")).style.height="14px";

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  [["products","Menu buttons"],["categories","Categories"],["coupons","Coupons"],["settings","Settings"],["team",`${roleLabel('cashier')}s & ${roleLabel('admin')}s`],["live","Live sales"],["reports","Day reports"]].forEach(([key,label])=>{
    const t = document.createElement("div");
    t.className = "tab" + (state.devTab===key ? " active":"");
    t.textContent = label;
    t.onclick = ()=>{ state.devTab = key; render(); };
    tabs.appendChild(t);
  });
  el.appendChild(tabs);

  const body = document.createElement("div");
  el.appendChild(body);

  $("#toggleActive").onclick = async ()=>{
    state.db.meta.appActive = !state.db.meta.appActive;
    await pushToDrive();
    render();
  };

  if(state.devTab==="products") return renderMenuList(body, true);
  if(state.devTab==="categories") return renderCategoriesList(body, true);
  if(state.devTab==="coupons") return renderCouponsList(body, true);
  if(state.devTab==="settings") return renderSettingsPanel(body);
  if(state.devTab==="team") return renderTeamList(body, true);
  if(state.devTab==="live") return renderLiveSales(body, true);
  if(state.devTab==="reports") return renderReportsList(body, true);
}

init();
