/* ---- Excel exports ---- */
function exportDayClosesExcel(){
  if(!window.XLSX){ toast("Excel library still loading, try again in a moment", "err"); return; }
  const days = buildDailyReports();
  const daily = days.map(r=>({
    Date: fmtDate(r.date),
    Cashiers: r.cashiers.join(", "),
    Transactions: r.transactionCount,
    Cash: r.cash, Card: r.card,
    "Coupons Used": r.couponsUsed.length,
    "Coupon Discount Total": r.couponsDiscountTotal,
    Total: r.total
  }));
  const perCashier = [], perProduct = [];
  days.forEach(r=>{
    r.rows.forEach(c=>perCashier.push({
      Date: fmtDate(r.date), Cashier: c.name, Started: fmtDateTime(c.start).slice(11),
      Transactions: c.transactionCount, Cash: c.cash, Card: c.card, Total: c.total
    }));
    Object.entries(r.byProduct).sort((a,b)=>b[1]-a[1]).forEach(([name,qty])=>perProduct.push({ Date: fmtDate(r.date), Product: name, Qty: qty }));
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(daily), "Day Reports");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(perCashier), "By Cashier");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(perProduct), "By Product");
  XLSX.writeFile(wb, "sade-day-reports.xlsx");
}

function exportMonthlyExcel(monthValue){
  if(!window.XLSX){ toast("Excel library still loading, try again in a moment", "err"); return; }
  if(!monthValue){ toast("Pick a month first", "err"); return; }
  const monthSales = state.db.sales.filter(s=>s.date.startsWith(monthValue));
  const byDay = {};
  monthSales.forEach(s=>{
    byDay[s.date] = byDay[s.date] || {Date:s.date, Transactions:0, Total:0};
    byDay[s.date].Transactions++;
    byDay[s.date].Total += s.total;
  });
  const byProduct = {};
  monthSales.forEach(s=>s.items.forEach(it=>{
    byProduct[it.name] = byProduct[it.name] || {Item:it.name, "Qty Sold":0, Revenue:0};
    byProduct[it.name]["Qty Sold"] += it.qty;
    byProduct[it.name].Revenue += it.price*it.qty;
  }));
  const salesRows = monthSales.map(s=>({
    Date:s.date, Time:new Date(s.timestamp).toLocaleTimeString(), Cashier:s.cashierName,
    Items: s.items.map(i=>i.qty+"x "+i.name).join(", "), Subtotal:s.subtotal,
    Coupon: s.discountAmt>0 ? s.couponCode : "", Discount:s.discountAmt||0,
    Total:s.total, Payment:s.payment
  }));
  const couponRows = monthSales.filter(s=>s.discountAmt>0 && s.couponCode).map(s=>({
    Date:s.date, Time:new Date(s.timestamp).toLocaleTimeString(), Cashier:s.cashierName,
    Code:s.couponCode, Percent:s.discountPercent, "Discount Given":s.discountAmt
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(byDay)), "Daily Summary");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesRows), "All Sales");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(byProduct)), "By Product");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(couponRows.length?couponRows:[{Date:"",Time:"",Cashier:"",Code:"",Percent:"",  "Discount Given":""}]), "Coupons Used");
  XLSX.writeFile(wb, "sade-monthly-report-"+monthValue+".xlsx");
}

/* ---- menu (flat, drag-reorderable) ---- */
function renderMenuList(el, editable){
  const freeLayout = !!state.db.meta.freeLayout;
  const layout = state.db.meta.layout || DEFAULT_LAYOUT;
  function priceLabel(p){ return (p.price===null || p.price===undefined) ? "Open price" : money(p.price); }

  function makeButton(p){
    const c = document.createElement("div");
    c.className = "product-btn" + (editable ? " draggable" : "");
    c.style.cursor = editable ? "grab" : "default";
    c.style.opacity = p.active===false ? "0.4" : "1";
    c.dataset.pid = p.id;
    c.innerHTML = `<div class="emoji">${p.emoji||"🧾"}</div><div class="pname">${p.name}</div><div class="pprice">${priceLabel(p)}</div>${freeLayout?"":`<div class="pcat">${categoryName(p.categoryId)}</div>`}`;
    if(editable){
      c.onclick = ()=>openProductModal(p);
      c.draggable = true;
      c.addEventListener("dragstart", e=>{ state.dragProductId = p.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
      c.addEventListener("dragend", ()=> c.classList.remove("dragging"));
      c.addEventListener("dragover", e=>{ e.preventDefault(); c.classList.add("drag-over"); });
      c.addEventListener("dragleave", ()=> c.classList.remove("drag-over"));
      c.addEventListener("drop", async e=>{
        e.preventDefault();
        c.classList.remove("drag-over");
        const draggedId = state.dragProductId;
        if(!draggedId || draggedId===p.id) return;
        const ordered = sortedProducts();
        const fromIdx = ordered.findIndex(x=>x.id===draggedId);
        const toIdx = ordered.findIndex(x=>x.id===p.id);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = ordered.splice(fromIdx,1);
        ordered.splice(toIdx,0,moved);
        ordered.forEach((prod,i)=>{ prod.order = i; prod.updatedAt = nowIso(); });
        await pushToDrive();
        render();
      });
    }
    return c;
  }

  el.innerHTML = `<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:6px;">
      <h3 style="font-size:15px;">Menu (${editable?"editable":"view only"}) — looks just like the cashier screen</h3>
      ${editable ? `<button class="btn btn-primary" id="addMenuBtn">➕ Add button</button>` : ""}
    </div>
    ${editable ? `
      <div class="free-toggle-row">
        <label style="display:flex; align-items:center; gap:8px; margin:0;"><input type="checkbox" id="freeLayoutToggle" style="width:auto;" ${freeLayout?"checked":""}/> Fixed grid layout (set an exact number of columns &amp; rows instead of grouping by category)</label>
      </div>
      ${freeLayout ? `
        <div class="settings-section" style="margin:14px 0;">
          <p style="font-size:12px; color:var(--crema-dim); margin-bottom:10px;">Set how many buttons should fit across and down — they're arranged and sized automatically to fill the space evenly, in the order below.</p>
          <div class="inline-row">
            <div class="field"><label>Columns</label><input type="number" id="gridCols" min="2" max="14" value="${layout.gridCols||6}" /></div>
            <div class="field"><label>Rows</label><input type="number" id="gridRows" min="1" max="10" value="${layout.gridRows||4}" /></div>
            <button class="btn btn-primary" id="applyGridBtn">Apply</button>
          </div>
        </div>
      ` : `<div class="drag-hint">Drag a button to reorder it — cashiers see the new order right away.</div>`}
    ` : ""}
    <div id="menuGrid"></div>
  </div>`;

  if($("#addMenuBtn")) $("#addMenuBtn").onclick = ()=>openProductModal(null);

  if(editable){
    $("#freeLayoutToggle").onchange = async e=>{
      state.db.meta.freeLayout = e.target.checked;
      await pushToDrive();
      render();
    };
    if(freeLayout){
      $("#applyGridBtn").onclick = async ()=>{
        const cols = Math.max(2, parseInt($("#gridCols").value,10) || 6);
        const rows = Math.max(1, parseInt($("#gridRows").value,10) || 4);
        const btnHeight = 100;
        state.db.meta.layout.gridCols = cols;
        state.db.meta.layout.gridRows = rows;
        state.db.meta.layout.btnHeight = btnHeight;
        state.db.meta.layout.canvasHeight = rows * (btnHeight + 10) + 10;
        applyLayout();
        await pushToDrive();
        toast(`Buttons auto-aligned to a ${cols}×${rows} grid`, "ok");
        render();
      };
    }
  }

  const host = $("#menuGrid");
  const products = sortedProducts();

  categoriesSorted().forEach(cat=>{
    const prods = products.filter(p=>p.categoryId===cat.id);
    if(prods.length===0 && !editable) return;
    const section = document.createElement("div");
    section.style.marginBottom = "18px";
    section.innerHTML = `<h3 style="font-size:14px; margin-bottom:10px; color:var(--crema-dim);">${cat.name}</h3>`;
    const grid = document.createElement("div");
    grid.className = "product-grid" + (freeLayout ? " fixed-grid" : "");
    if(freeLayout){
      grid.style.setProperty("--grid-cols", layout.gridCols || 6);
      grid.style.setProperty("--btn-height", (layout.btnHeight||100) + "px");
    }
    prods.forEach(p=> grid.appendChild(makeButton(p)));
    if(prods.length===0) grid.innerHTML = `<div style="font-size:12px; color:var(--crema-dim);">No items in this category yet.</div>`;
    section.appendChild(grid);
    host.appendChild(section);
  });
  if(products.length===0){
    host.innerHTML = `<div class="empty-state"><div class="big">🧾</div><p>No menu buttons yet — click "Add button" above to create your first one.</p></div>`;
  }
}

function openProductModal(product){

  const cats = categoriesSorted();

  bg.innerHTML = `

      <div class="field"><label>Category</label><select id="pfCat">${cats.map(c=>`<option value="${c.id}" ${product&&product.categoryId===c.id?"selected":""}>${c.name}</option>`).join("")}</select></div>
      <div class="field"><label>Emoji</label><input id="pfEmoji" value="${product?product.emoji:"☕"}" maxlength="4" /></div>
      <div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="pfDrink" style="width:auto;" ${!product || product.isDrink!==false ? "checked":""}/> Eligible for drink coupons</label></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="pfActive" style="width:auto;" ${product.active!==false?"checked":""}/> Button visible to cashiers</label></div>` : ""}
      <div class="field">
        <label>Add-on options (the cashier gets a popup with these when tapping this button)</label>
        <div id="pfGroups"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-outline" id="pfAddRadio">➕ Radio group</button>
          <button type="button" class="btn btn-outline" id="pfAddCheck">➕ Checkbox group</button>
        </div>
      </div>
      <div class="field">
        <label>Stock (Inventory)</label>
        <select id="pfInvMode">
          <option value="none">Not tracked</option>
          <option value="simple">Simple — takes stock off one item</option>
          <option value="recipe">Recipe — uses several ingredients</option>
        </select>
        <div id="pfInvLines" style="margin-top:8px;"></div>
        <button type="button" class="btn btn-outline" id="pfInvAdd" style="margin-top:4px;">➕ Ingredient</button>
      </div>
      <div class="modal-actions">
        ${!isNew && !isSup() ? '<button class="btn btn-danger" id="delProd">Delete</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelProd">Cancel</button>
        <button class="btn btn-primary" id="saveProd">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#cancelProd").onclick = ()=>bg.remove();

  /* ---- add-on option groups editor ---- */
  let groupsDraft = JSON.parse(JSON.stringify((product && product.optionGroups) || []));
  const gHost = bg.querySelector("#pfGroups");
  const newChoice = ()=>({ id: uid(), label:"", price:0 });
  function drawGroups(){
    gHost.innerHTML = "";
    groupsDraft.forEach((g, gi)=>{
      const isRadio = g.type==="radio";
      const req = isRadio ? g.required!==false : g.required===true;
      const box = document.createElement("div");
      box.className = "og-box";
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <b style="font-size:13px;">${isRadio ? "🔘 Radio group (pick one)" : "☑️ Checkbox group (pick any)"}</b>
          <a class="link" data-act="rm">Remove</a>
        </div>
        <div class="field"><label>Title shown to the cashier (e.g. Milk)</label><input data-f="title" value="${esc(g.title)}" /></div>
        <div class="inline-row">
          <div class="field"><label>Number of ${isRadio ? "radio buttons" : "checkboxes"}</label><input type="number" min="1" max="12" data-f="count" value="${g.choices.length}" /></div>
          <div class="field" style="align-self:flex-end;"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" data-f="required" style="width:auto;" ${req ? "checked" : ""}/> Required</label></div>
        </div>
        ${g.choices.map((c,ci)=>`
          <div class="og-row">
            <input data-f="label" data-ci="${ci}" placeholder="Choice ${ci+1} name" value="${esc(c.label)}" />
            <input data-f="price" data-ci="${ci}" type="number" step="0.01" min="0" placeholder="Extra price" style="max-width:110px;" value="${c.price>0 ? c.price : ""}" />
          </div>
          ${invItemsActive().length ? `<div class="og-row" style="margin:-2px 0 10px;">
            <select data-f="invItem" data-ci="${ci}" style="flex:2;"><option value="">Uses no stock</option>${invItemsActive().slice().sort(byNameCmp).map(it=>`<option value="${it.id}" ${(c.invUse && c.invUse[0] && c.invUse[0].itemId===it.id) ? "selected" : ""}>Uses ${esc(it.name)} (${esc(it.unit)})</option>`).join("")}</select>
            <input data-f="invQty" data-ci="${ci}" type="number" step="any" min="0" placeholder="Amount" style="flex:1; min-width:70px;" value="${c.invUse && c.invUse[0] ? c.invUse[0].qty : ""}" />
          </div>` : ""}`).join("")}`;
      box.addEventListener("input", e=>{
        const f = e.target.dataset.f;
        if(f==="title") g.title = e.target.value;
        else if(f==="label") g.choices[+e.target.dataset.ci].label = e.target.value;
        else if(f==="price") g.choices[+e.target.dataset.ci].price = parseFloat(e.target.value) || 0;
      });
      box.addEventListener("change", e=>{
        const f = e.target.dataset.f;
        if(f==="required") g.required = e.target.checked;
        if(f==="invItem"){
          const c = g.choices[+e.target.dataset.ci];
          const prev = (c.invUse && c.invUse[0]) ? c.invUse[0].qty : 1;
          c.invUse = e.target.value ? [{ itemId: e.target.value, qty: prev || 1 }] : [];
          drawGroups();
        }
        if(f==="invQty"){
          const c = g.choices[+e.target.dataset.ci];
          if(c.invUse && c.invUse[0]) c.invUse[0].qty = parseFloat(e.target.value) || 0;

          g.choices.length = n;
          drawGroups();

      box.querySelector('[data-act="rm"]').onclick = ()=>{ groupsDraft.splice(gi,1); drawGroups(); };
      gHost.appendChild(box);

  bg.querySelector("#pfAddRadio").onclick = ()=>{
    groupsDraft.push({ id: uid(), type:"radio", title:"", required:true, choices:[newChoice(), newChoice()] });

  bg.querySelector("#pfAddCheck").onclick = ()=>{
    groupsDraft.push({ id: uid(), type:"check", title:"", required:false, choices:[newChoice(), newChoice()] });
    drawGroups();
  };
  drawGroups();

  /* ---- stock use (Inventory) ---- */
  let invMode = (product && product.invMode) || "none";
  let invDraft = JSON.parse(JSON.stringify((product && product.invUse) || []));
  const invHost = bg.querySelector("#pfInvLines");
  function drawInv(){

    if(items.length===0){ invHost.innerHTML = `<p style="font-size:12px; color:var(--crema-dim);">No stock items yet — add them in the Inventory tab first.</p>`; return; }
    if(invMode==="simple"){ invDraft = invDraft.slice(0,1); if(invDraft.length===0) invDraft = [{ itemId:"", qty:1 }]; }
    if(invMode==="recipe" && invDraft.length===0) invDraft = [{ itemId:"", qty:1 }];
    invHost.innerHTML = invDraft.map((u,i)=>`
      <div class="og-row">
        <select data-i="${i}" data-f="item" style="flex:2;"><option value="">Choose item…</option>${items.map(it=>`<option value="${it.id}" ${u.itemId===it.id?"selected":""}>${esc(it.name)} (${esc(it.unit)})</option>`).join("")}</select>
        <input data-i="${i}" data-f="qty" type="number" step="any" min="0" value="${u.qty}" style="flex:1; min-width:70px;" />
        ${invMode==="recipe" && invDraft.length>1 ? `<a class="link" data-i="${i}" data-f="rm" style="align-self:center; color:var(--err);">✕</a>` : ""}
      </div>`).join("") + `<div style="font-size:11.5px; color:var(--crema-dim);">${invMode==="simple" ? "Amount taken off this item for each one sold." : "Amount of each ingredient used for each one sold."}</div>`;
  }
  bg.querySelector("#pfInvMode").onchange = e=>{ invMode = e.target.value; drawInv(); };
  bg.querySelector("#pfInvAdd").onclick = ()=>{ invDraft.push({ itemId:"", qty:1 }); drawInv(); };
  invHost.addEventListener("change", e=>{
    const i = +e.target.dataset.i, f = e.target.dataset.f;
    if(f==="item") invDraft[i].itemId = e.target.value;
    if(f==="qty") invDraft[i].qty = parseFloat(e.target.value) || 0;
  });
  invHost.addEventListener("click", e=>{
    if(e.target.dataset.f==="rm"){ invDraft.splice(+e.target.dataset.i,1); drawInv(); }
  });
  drawInv();
  $("#saveProd").onclick = async ()=>{
    const name = $("#pfName").value.trim();
    const priceRaw = $("#pfPrice").value.trim();
    const price = priceRaw==="" ? null : parseFloat(priceRaw);
    const categoryId = $("#pfCat").value;
    const isDrink = $("#pfDrink").checked;
    if(!name || (priceRaw!=="" && isNaN(price))){ toast("Enter a name, and either a price or leave it blank for open price","err"); return; }
    const cleanGroups = [];
    for(const g of groupsDraft){
      const choices = g.choices.map(c=>({ id:c.id, label:(c.label||"").trim(), price: Math.max(0, +c.price || 0), invUse:(c.invUse||[]).filter(u=>u.itemId && u.qty>0) })).filter(c=>c.label);
      const title = (g.title||"").trim();
      if(!title && choices.length===0) continue;   // completely blank group — ignore it
      if(!title){ toast("Give every add-on group a title","err"); return; }
      if(choices.length===0){ toast(`"${title}" needs at least one named choice`,"err"); return; }
      cleanGroups.push({ id:g.id, type:g.type, title, required: g.type==="radio" ? g.required!==false : g.required===true, choices });
    }
    const cleanUse = invMode==="none" ? [] : invDraft.filter(u=>u.itemId && u.qty>0).map(u=>({ itemId:u.itemId, qty:u.qty }));
    if(invMode!=="none" && cleanUse.length===0){ toast("Choose a stock item and amount, or set Stock to “Not tracked”","err"); return; }
    if(isNew){
      const maxOrder = state.db.products.reduce((m,p)=>Math.max(m, p.order??0), -1);
      state.db.products.push({
        id: uid(), name, price, categoryId,
        emoji: $("#pfEmoji").value.trim()||"🧾", isDrink, active:true, order: maxOrder+1, optionGroups: cleanGroups, invMode, invUse: cleanUse,
        updatedAt: nowIso()
      });
    } else {
      Object.assign(product, {
        name, price, categoryId,
        emoji: $("#pfEmoji").value.trim()||"🧾", isDrink, optionGroups: cleanGroups, invMode, invUse: cleanUse,
        active: $("#pfActive").checked, updatedAt: nowIso()
      });
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew && !isSup()){
    $("#delProd").onclick = async ()=>{
      product.deleted = true; product.active = false; product.updatedAt = nowIso();
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ================= CATEGORIES ================= */
function renderCategoriesList(el, editable){
  const cats = categoriesSorted();
  el.innerHTML = `<div class="card">
    <h3 style="margin-bottom:6px; font-size:15px;">Categories (${editable?"editable":"view only"})</h3>
    ${editable && !isSup() ? `<div class="drag-hint">Drag to reorder how categories appear on the cashier screen.</div>` : ""}
    <div id="catList"></div>
    ${editable?'<button class="btn btn-primary" id="addCatBtn" style="margin-top:10px;">Add category</button>':""}
  </div>`;
  const list = $("#catList");
  cats.forEach(cat=>{
    const count = sortedProducts().filter(p=>p.categoryId===cat.id).length;
    const row = document.createElement("div");
    row.className = "cat-row";
    row.style.cursor = (editable && !isSup()) ? "grab" : "default";
    row.innerHTML = `<div><div class="cname">${cat.name}</div><div class="ccount">${count} item${count===1?"":"s"}</div></div>${editable && !isSup()?'<a class="link">Edit</a>':""}`;
    if(editable && !isSup()){
      row.draggable = true;
      row.querySelector("a").onclick = ()=>openCategoryModal(cat);
      row.addEventListener("dragstart", e=>{ state.dragCategoryId = cat.id; row.classList.add("dragging"); });
      row.addEventListener("dragend", ()=> row.classList.remove("dragging"));
      row.addEventListener("dragover", e=>{ e.preventDefault(); row.classList.add("drag-over"); });
      row.addEventListener("dragleave", ()=> row.classList.remove("drag-over"));
      row.addEventListener("drop", async e=>{
        e.preventDefault();
        row.classList.remove("drag-over");
        const draggedId = state.dragCategoryId;
        if(!draggedId || draggedId===cat.id) return;
        const ordered = categoriesSorted();
        const fromIdx = ordered.findIndex(x=>x.id===draggedId);
        const toIdx = ordered.findIndex(x=>x.id===cat.id);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = ordered.splice(fromIdx,1);
        ordered.splice(toIdx,0,moved);
        ordered.forEach((c,i)=>{ c.order = i; });
        await pushToDrive();
        render();
      });
    }
    list.appendChild(row);
  });
  if(editable){
    $("#addCatBtn").onclick = ()=>openCategoryModal(null);
  }
}

function openCategoryModal(cat){
  const isNew = !cat;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "New category" : "Edit category"}</h3>
      <div class="field"><label>Name</label><input id="ctName" value="${cat?cat.name:""}" /></div>
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="delCat">Delete</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelCat">Cancel</button>
        <button class="btn btn-primary" id="saveCat">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#cancelCat").onclick = ()=>bg.remove();
  $("#saveCat").onclick = async ()=>{
    const name = $("#ctName").value.trim();
    if(!name){ toast("Name is required","err"); return; }
    if(isNew){
      const maxOrder = state.db.categories.reduce((m,c)=>Math.max(m,c.order??0), -1);
      state.db.categories.push({ id: uid(), name, order: maxOrder+1 });
    } else {
      cat.name = name;
    }

      const fallback = remaining[0];
      state.db.products.forEach(p=>{ if(p.categoryId===cat.id) { p.categoryId = fallback.id; p.updatedAt = nowIso(); } });
      cat.deleted = true; cat.updatedAt = nowIso();
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ================= COUPONS ================= */
function renderCouponsList(el, editable){
  const coupons = visibleCoupons().slice().sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));
  el.innerHTML = `<div class="card"><h3 style="margin-bottom:6px; font-size:15px;">Coupons (${editable?"editable":"view only"})</h3>
    <p style="font-size:12px; color:var(--crema-dim); margin-bottom:12px;">Coupons only discount drink items, one drink per sale (the most expensive eligible drink) — and each code works once. The moment a coupon is used in a completed sale, its status changes to "Used" and it can never be applied again.</p>
    <table><thead><tr><th>Code</th><th>Discount</th><th>Status</th>${editable?"<th></th>":""}</tr></thead>
    <tbody id="couponBody"></tbody></table>
    ${editable?`
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button class="btn btn-primary" id="addCouponBtn">Add coupon</button>
        <button class="btn btn-outline" id="uploadCsvBtn">⬆️ Upload codes from CSV</button>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" />
      </div>
      <p style="font-size:11.5px; color:var(--crema-dim); margin-top:8px;">CSV format: one line per code, <code>code,percent</code> — e.g. <code>WELCOME10,10</code>. A header row is fine and will be skipped automatically.</p>
    `:""}
    </div>`;
  const body = $("#couponBody");
  if(coupons.length===0){
    body.innerHTML = `<tr><td colspan="${editable?4:3}" style="text-align:center; color:var(--crema-dim); padding:24px;">No coupons yet.</td></tr>`;
  }
  coupons.forEach(c=>{
    const status = couponStatus(c);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="mono">${c.code}</td><td>${c.percent}% off</td>
      <td style="color:${status.color};">${status.label}</td>
      ${editable?`<td>${c.usedInSale
        ? `<a class="link" data-used-delete="${c.id}" style="color:var(--err);">Delete</a>`
        : `<a class="link" data-cid="${c.id}">Edit</a>`}</td>`:""}`;
    body.appendChild(tr);
  });
  if(editable){
    $("#addCouponBtn").onclick = ()=>openCouponModal(null);
    body.querySelectorAll("a[data-cid]").forEach(a=>{
      a.onclick = ()=>openCouponModal(coupons.find(c=>c.id===a.dataset.cid));
    });
    body.querySelectorAll("a[data-used-delete]").forEach(a=>{
      a.onclick = async ()=>{
        const c = coupons.find(x=>x.id===a.dataset.usedDelete);
        if(!c) return;
        if(!confirm(`Remove the used code ${c.code} from this list? It's already spent and can't be reused either way — this just clears it from view.`)) return;
        // stays a tombstone (deleted stays true, so it can never be re-applied);
        // clearing usedInSale is what drops it out of the visible list.
        c.usedInSale = false;
        c.updatedAt = nowIso();
        await pushToDrive();
        toast("Removed from list", "ok");
        render();
      };
    });
    $("#uploadCsvBtn").onclick = ()=> $("#csvFileInput").click();
    $("#csvFileInput").addEventListener("change", async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const text = await file.text();
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      let added = 0, skipped = 0;
      if(!state.db.coupons) state.db.coupons = [];
      const existingCodes = new Set(activeCoupons().map(c=>c.code.toUpperCase()));
      lines.forEach(line=>{
        const parts = line.split(",").map(p=>p.trim());
        const code = (parts[0]||"").toUpperCase();
        const percent = parseFloat(parts[1]);
        if(!code || code==="CODE" || isNaN(percent) || percent<=0 || percent>100){ skipped++; return; }
        if(existingCodes.has(code)){ skipped++; return; }
        state.db.coupons.push({ id: uid(), code, percent, active:true, createdAt: nowIso(), updatedAt: nowIso() });
        existingCodes.add(code);
        added++;
      });
      if(added>0) await pushToDrive();
      toast(`${added} coupon${added===1?"":"s"} added${skipped?`, ${skipped} skipped`:""}`, added>0?"ok":"err");
      e.target.value = "";
      render();
    });
  }
}

function openCouponModal(coupon){

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "New coupon" : "Edit coupon"}</h3>

      <div class="field"><label>Discount percent (%)</label><input id="cfPercent" type="number" min="1" max="100" value="${coupon?coupon.percent:10}" /></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="cfActive" style="width:auto;" ${coupon.active!==false?"checked":""}/> Coupon active</label></div>` : ""}

    bg.remove();

      coupon.deleted = true; coupon.active = false; coupon.updatedAt = nowIso();
      await pushToDrive();
      bg.remove();

function openUserModal(user){
  const isNew = !user;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "Add team member" : "Edit team member"}</h3>
      <div class="field"><label>Full name</label><input id="ufName" value="${user?user.name:""}" /></div>
      <div class="field"><label>Username</label><input id="ufUser" value="${user?user.username:""}" ${user?"disabled":""} /></div>
      <div class="field"><label>Role</label>
        <select id="ufRole">
          <option value="cashier" ${user&&user.role==='cashier'?'selected':''}>${roleLabel('cashier')}</option>
          ${isSup() ? "" : `<option value="admin" ${user&&user.role==='admin'?'selected':''}>${roleLabel('admin')}</option>
          <option value="supervisor" ${user&&user.role==='supervisor'?'selected':''}>${roleLabel('supervisor')}</option>`}
        </select>
      </div>
      <div class="field"><label>${isNew?"Password":"New password (leave blank to keep current)"}</label><input id="ufPass" type="password" /></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="ufActive" style="width:auto;" ${user.active!==false?"checked":""}/> Account active</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew && !isSup() ? '<button class="btn btn-danger" id="delUser">Remove</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelUser">Cancel</button>
        <button class="btn btn-primary" id="saveUser">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#cancelUser").onclick = ()=>bg.remove();
  $("#saveUser").onclick = async ()=>{
    const name = $("#ufName").value.trim();
    const username = $("#ufUser").value.trim();
    const role = isSup() ? "cashier" : $("#ufRole").value;
    const pass = $("#ufPass").value;
    if(!name || !username){ toast("Name and username are required","err"); return; }
    if(isNew){
      if(activeUsers().some(u=>u.username.toLowerCase()===username.toLowerCase())){
        toast("Username already exists","err"); return;
      }
      if(!pass){ toast("Password is required","err"); return; }
      const hash = await sha256(pass);
      state.db.users.push({ id: uid(), username, passwordHash: hash, role, name, active:true, createdAt: nowIso(), updatedAt: nowIso() });
    } else {
      user.name = name; user.role = role; user.updatedAt = nowIso();
      user.active = $("#ufActive").checked;
      if(pass) user.passwordHash = await sha256(pass);
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew && !isSup()){
    $("#delUser").onclick = async ()=>{
      user.deleted = true; user.active = false; user.updatedAt = nowIso();
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ================= INVENTORY =================
   Items (coffee beans, milk, cups…) and every change to them are stored as records:
   Received (+), Waste (−), Count (sets the exact number). Sales take stock off automatically:
   "simple" = a menu button takes stock off one item, "recipe" = a button uses several ingredients
   (add-on choices can use stock too). Current stock = latest count + later received − later waste − sales since then.
   The developer's Inventory switch controls whether it shows to admins and cashiers. */
const byNameCmp = (a,b)=>String(a.name).localeCompare(String(b.name));
const INV_UNITS = ["pcs","kg","g","L","ml","pack","box","bottle","bag"];
function fmtQty(n){ return String(Math.round((+n||0)*100)/100); }
function invItemsActive(includeInactive){ return (state.db.invItems||[]).filter(i=>!i.deleted && (includeInactive || i.active!==false)); }

let _invMemo = { key:"", map:null };
function invStockMap(){
  const db = state.db;
  const key = db.sales.length + "|" + (db.invMoves||[]).length + "|" + (db.invItems||[]).length;
  if(_invMemo.key===key && _invMemo.map) return _invMemo.map;
  const map = {}, base = {};
  invItemsActive(true).forEach(i=>{ map[i.id] = 0; });
  (db.invMoves||[]).forEach(m=>{
    if(m.type==="count" && map[m.itemId]!==undefined){
      const b = base[m.itemId];
      if(!b || m.timestamp > b.ts) base[m.itemId] = { ts:m.timestamp, qty:m.qty };
    }
  });
  Object.keys(base).forEach(id=>{ map[id] = base[id].qty; });
  (db.invMoves||[]).forEach(m=>{
    if(m.type==="count" || map[m.itemId]===undefined) return;
    const b = base[m.itemId];
    if(b && m.timestamp <= b.ts) return;
    map[m.itemId] += (m.type==="receive" ? m.qty : -m.qty);
  });
  db.sales.forEach(s=>{
    if(!s.inv) return;
    Object.keys(s.inv).forEach(id=>{
      if(map[id]===undefined) return;
      const b = base[id];
      if(b && s.timestamp <= b.ts) return;
      map[id] -= s.inv[id];
    });
  });
  Object.keys(map).forEach(id=>{ map[id] = Math.round(map[id]*1000)/1000; });
  _invMemo = { key, map };
  return map;
}
function invStatus(item, qty){
  if(qty <= 0) return "out";
  if((item.min||0) > 0 && qty <= item.min) return "low";
  return "ok";
}
function invAlertCount(){
  const stock = invStockMap();
  return invItemsActive().filter(i=>invStatus(i, stock[i.id]||0)!=="ok").length;
}
function invBadge(){ const n = invAlertCount(); return n ? " (" + n + ")" : ""; }

function productUse(p){
  return (p && p.invMode && p.invMode!=="none" && p.invUse) ? p.invUse.filter(u=>u.itemId && u.qty>0) : [];
}
function cartInvNeeds(lines){
  const need = {};
  lines.forEach(l=>{
    const p = state.db.products.find(x=>x.id===l.productId);
    productUse(p).forEach(u=>{ need[u.itemId] = (need[u.itemId]||0) + u.qty * l.qty; });
    (l.options||[]).forEach(o=>(o.choices||[]).forEach(c=>(c.inv||[]).forEach(u=>{
      if(u.itemId && u.qty>0) need[u.itemId] = (need[u.itemId]||0) + u.qty * l.qty;
    })));
  });
  return need;
}
function invForSale(){
  const need = cartInvNeeds(state.cart), out = {};
  Object.keys(need).forEach(k=>{ out[k] = Math.round(need[k]*1000)/1000; });
  return Object.keys(out).length ? out : undefined;
}
/* returns {item, left} for the first item that can't cover the lines, or null */
function checkCartStock(lines){
  if(!state.db.meta.inventoryEnabled) return null;
  const need = cartInvNeeds(lines), stock = invStockMap();
  for(const id of Object.keys(need)){
    const it = invItemsActive().find(x=>x.id===id);
    if(!it || it.block===false) continue;
    const have = stock[id] || 0;
    if(need[id] > have + 1e-9) return { item: it, left: Math.max(0, have) };
  }
  return null;
}
function stockToast(prob, name){
  if(prob.left <= 0) toast(`${name} is sold out — ${prob.item.name} has run out`, "err");
  else toast(`Not enough ${prob.item.name} — only ${fmtQty(prob.left)} ${prob.item.unit} in stock`, "err");
}
function invItemOut(itemId, qty){
  const it = invItemsActive().find(x=>x.id===itemId);
  if(!it || it.block===false) return false;
  return (invStockMap()[itemId]||0) < (qty||1) - 1e-9;
}
function productSoldOut(p){
  if(!state.db.meta.inventoryEnabled) return false;
  return productUse(p).some(u=>invItemOut(u.itemId, u.qty));
}
function choiceOut(c){
  if(!state.db.meta.inventoryEnabled) return false;
  return (c.invUse||[]).some(u=>u.itemId && invItemOut(u.itemId, u.qty));
}
function stockBtnHtml(){
  const m = state.db.meta;
  if(!m.inventoryEnabled || m.inventoryCashier==="mark") return "";
  return `<button class="btn btn-outline" id="stockBtn">📦 Stock${invBadge()}</button>`;
}

function invWho(){ return (state.currentUser && (state.currentUser.name || state.currentUser.username)) || ""; }

/* receive / waste / count */
function openInvMoveModal(item, type, onDone){
  const stock = invStockMap()[item.id] || 0;
  const titles = { receive:"➕ Received", waste:"🗑 Waste", count:"✏️ Count" };
  const hints = {
    receive:"How much arrived?",
    waste:"How much was thrown away or lost?",
    count:"How much is on the shelf right now?"
  };
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${titles[type]} — ${esc(item.name)}</h3>
      <p style="font-size:12.5px; color:var(--crema-dim); margin-bottom:10px;">In stock now: <b>${fmtQty(stock)} ${esc(item.unit)}</b></p>
      <div class="field"><label>${hints[type]} (${esc(item.unit)})</label><input id="imQty" type="number" inputmode="decimal" step="any" min="0" /></div>
      ${type==="waste" ? `<div class="field"><label>Reason</label><select id="imNote">
          <option>Spoiled / expired</option><option>Dropped or spilled</option><option>Staff use</option><option>Other</option></select></div>` : ""}
      ${type==="receive" ? `<div class="field"><label>Note (optional, e.g. supplier)</label><input id="imNote" /></div>` : ""}
      <div class="modal-actions">
        <button class="btn btn-outline" id="imCancel">Cancel</button>
        <button class="btn btn-primary" id="imSave">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const qtyEl = bg.querySelector("#imQty");
  qtyEl.focus();
  bg.querySelector("#imCancel").onclick = ()=>bg.remove();
  async function save(){
    const qty = parseFloat(qtyEl.value);
    if(isNaN(qty) || qty < 0 || (type!=="count" && qty===0)){ toast("Enter an amount","err"); return; }
    const noteEl = bg.querySelector("#imNote");
    state.db.invMoves.push({ id: uid(), itemId: item.id, type, qty, note: noteEl ? noteEl.value.trim() : "", by: invWho(), timestamp: nowIso() });
    await pushToDrive();
    bg.remove();
    toast(type==="count" ? "Stock count saved" : (type==="receive" ? "Delivery added" : "Waste recorded"), "ok");
    if(onDone) onDone();
  }
  bg.querySelector("#imSave").onclick = save;
  qtyEl.addEventListener("keydown", e=>{ if(e.key==="Enter") save(); });
}

/* developer: add / edit an item */
function openInvItemModal(item){
  const isNew = !item;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "New stock item" : "Edit stock item"}</h3>
      <div class="field"><label>Name (e.g. Coffee beans)</label><input id="iiName" value="${item ? esc(item.name) : ""}" /></div>
      <div class="inline-row">
        <div class="field"><label>Unit</label><select id="iiUnit">${INV_UNITS.map(u=>`<option ${(item ? item.unit : "pcs")===u ? "selected" : ""}>${u}</option>`).join("")}</select></div>
        ${isNew ? `<div class="field"><label>Starting stock</label><input id="iiStart" type="number" step="any" min="0" value="0" /></div>` : ""}
      </div>
      <div class="inline-row">
        <div class="field"><label>Warn when stock is at or below</label><input id="iiMin" type="number" step="any" min="0" value="${item ? (item.min||0) : 0}" /></div>
        <div class="field"><label>Refill up to (shopping list)</label><input id="iiTarget" type="number" step="any" min="0" value="${item && item.target ? item.target : ""}" placeholder="auto" /></div>
      </div>
      <div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="iiBlock" style="width:auto;" ${!item || item.block!==false ? "checked" : ""}/> Don't allow selling when it runs out (shows “Sold out”)</label></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="iiActive" style="width:auto;" ${item.active!==false ? "checked" : ""}/> Active</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="iiDel">Delete</button>' : '<span></span>'}
        <button class="btn btn-outline" id="iiCancel">Cancel</button>
        <button class="btn btn-primary" id="iiSave">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#iiCancel").onclick = ()=>bg.remove();
  bg.querySelector("#iiSave").onclick = async ()=>{
    const name = bg.querySelector("#iiName").value.trim();
    if(!name){ toast("Enter a name","err"); return; }
    if(invItemsActive(true).some(i=>i.name.toLowerCase()===name.toLowerCase() && (!item || i.id!==item.id))){ toast("An item with this name already exists","err"); return; }
    const unit = bg.querySelector("#iiUnit").value;
    const min = Math.max(0, parseFloat(bg.querySelector("#iiMin").value) || 0);
    const target = Math.max(0, parseFloat(bg.querySelector("#iiTarget").value) || 0);
    const block = bg.querySelector("#iiBlock").checked;
    if(isNew){
      const rec = { id: uid(), name, unit, min, target, block, active:true, createdAt: nowIso(), updatedAt: nowIso() };
      state.db.invItems.push(rec);
      const start = parseFloat(bg.querySelector("#iiStart").value) || 0;
      if(start > 0) state.db.invMoves.push({ id: uid(), itemId: rec.id, type:"count", qty:start, note:"Starting stock", by: invWho(), timestamp: nowIso() });
    } else {
      Object.assign(item, { name, unit, min, target, block, active: bg.querySelector("#iiActive").checked, updatedAt: nowIso() });
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew){
    bg.querySelector("#iiDel").onclick = async ()=>{
      if(!confirm(`Delete "${item.name}"? Menu buttons that use it will stop tracking it.`)) return;
      item.deleted = true; item.active = false; item.updatedAt = nowIso();
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

function openInvHistory(){

    const u = esc(names[m.itemId].unit), q = fmtQty(m.qty);

    if(m.type==="waste") return `<span style="color:var(--err);">−${q} ${u}</span> waste`;
    return `counted <b>${q} ${u}</b>`;
  };
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal" style="max-height:80vh; overflow:auto;">

        ${rows.map(m=>`<tr><td class="mono" style="white-space:nowrap;">${fmtDateTime(m.timestamp)}</td><td>${esc(names[m.itemId].name)}</td><td>${desc(m)}${m.note ? `<div class="inv-sub">${esc(m.note)}</div>` : ""}</td><td>${esc(m.by||"")}</td></tr>`).join("")}

    </div>`;

function openShoppingList(){
  const stock = invStockMap();
  const list = invItemsActive().filter(i=>invStatus(i, stock[i.id]||0)!=="ok").sort(byNameCmp).map(i=>{
    const have = stock[i.id] || 0;

    return { item:i, have, order: Math.max(0, Math.round((target - have)*100)/100) };
  });
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal" style="max-height:80vh; overflow:auto;">
      <h3>🛒 Shopping list</h3>
      ${list.length ? `<table><thead><tr><th>Item</th><th>In stock</th><th style="text-align:right;">Order</th></tr></thead><tbody>

      <div class="modal-actions">

      XLSX.writeFile(wb, "sade-shopping-list-" + todayStr() + ".xlsx");
    };
  }
}

function wireInvRows(root, opts, refresh){
  root.querySelectorAll("[data-act]").forEach(b=>{
    b.onclick = ()=>{

      if(!item) return;

  });
  const search = root.querySelector("#invSearch");
  if(search) search.oninput = ()=>{
    const q = search.value.trim().toLowerCase();
    root.querySelectorAll(".inv-row").forEach(r=>{ r.style.display = (!q || r.dataset.name.includes(q)) ? "" : "none"; });
  };
}

      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">

        ${isDev ? `<button class="btn btn-primary" id="invAdd">➕ Add item</button>` : ""}
        <button class="btn btn-outline" id="invShop">🛒 Shopping list</button>

    </div>`;
  if(isDev){
    $("#invOn").onchange = async e=>{ state.db.meta.inventoryEnabled = e.target.checked; await pushToDrive(); render(); };
    $("#invAdm").onchange = async e=>{ state.db.meta.inventoryAdmin = e.target.checked; await pushToDrive(); render(); };
    $("#invCash").onchange = async e=>{ state.db.meta.inventoryCashier = e.target.value; await pushToDrive(); render(); };

  }

/* ================= STAFF ALLOWANCE =================
   Developer sets, per person, how many free (or discounted) drinks and foods they get per
   day / week / month. Cashiers never see the remaining numbers — the allowance is simply
   applied automatically when a staff member is selected on an order. Usage is stored in
   db.staffUsage (append-only, merged across devices) and resets by period. */
function currentStaff(){ return (state.db.meta.staffEnabled && state.staffMember) ? state.staffMember : null; }
function allStaff(){ return (state.db.staff||[]).filter(s=>!s.deleted); }
function activeStaff(){ return allStaff().filter(s=>s.active!==false); }
function staffPeriodStart(period){
  const t = todayStr();
  const d = new Date(t+"T00:00:00Z");
  if(period==="week"){ d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10); }
  if(period==="month") return t.slice(0,8)+"01";
  return t;
}
function staffRemaining(staff){
  const start = staffPeriodStart(staff.period), today = todayStr();
  const used = { drink:0, food:0 };
  (state.db.staffUsage||[]).forEach(u=>{
    if(u.staffId===staff.id && u.date>=start && u.date<=today && used[u.kind]!==undefined) used[u.kind] += (u.qty||0);
  });
  return { drink: Math.max(0,(staff.drinksAllowed||0)-used.drink), food: Math.max(0,(staff.foodAllowed||0)-used.food) };
}
/* the allowance goes to the highest-priced units first, up to what's left for the period */
function computeStaffDiscount(cart, staffRef){
  const out = { amount:0, drink:0, food:0 };
  if(!staffRef || !state.db.meta.staffEnabled) return out;
  const staff = allStaff().find(s=>s.id===staffRef.id);
  if(!staff || staff.active===false) return out;
  const rem = staffRemaining(staff);
  const pctRaw = state.db.meta.staffDiscountPercent;
  const pct = Math.max(0, Math.min(100, pctRaw===undefined || pctRaw===null ? 100 : pctRaw));
  ["drink","food"].forEach(kind=>{
    const units = [];
    cart.forEach(i=>{
      if((i.isDrink!==false) === (kind==="drink")) for(let k=0;k<i.qty;k++) units.push(i.price);
    });
    units.sort((a,b)=>b-a);
    const n = Math.min(rem[kind], units.length);
    out[kind] = n;
    out.amount += units.slice(0,n).reduce((s,p)=>s+p,0) * pct / 100;
  });
  return out;
}

/* cashier: choose who the order is for (asks for the 4-digit PIN when that switch is on) */
function openStaffPicker(){
  const byName = (a,b)=>String(a.name).localeCompare(String(b.name));
  let list = activeStaff().slice().sort(byName);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  document.body.appendChild(bg);

  function choose(staff){
    state.staffMember = { id: staff.id, name: staff.name };
    if(state.appliedCoupon){
      state.appliedCoupon = null;
      toast("Coupon removed — it can't be combined with a staff order");
    }
    if(state.numpadTarget && state.numpadTarget.kind==="coupon"){ state.numpadTarget = null; state.numpadAmount = ""; }
    bg.remove();
    render();
  }
  function showPin(staff){
    bg.innerHTML = `
      <div class="modal">
        <h3>${esc(staff.name)}</h3>
        <div class="field"><label>Enter 4-digit PIN</label><input id="stfPinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" /></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="stfBack">Back</button>
          <button class="btn btn-primary" id="stfPinOk">Confirm</button>
        </div>
      </div>`;
    const input = bg.querySelector("#stfPinInput");
    input.focus();
    async function submit(){
      if(!/^\d{4}$/.test(input.value)){ toast("Enter the 4-digit PIN","err"); return; }
      const hash = await sha256(staff.id+":"+input.value);
      if(hash !== staff.pinHash){ toast("Wrong PIN","err"); input.value = ""; input.focus(); return; }
      choose(staff);
    }
    bg.querySelector("#stfPinOk").onclick = submit;
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    bg.querySelector("#stfBack").onclick = showList;
  }
  function showList(){
    bg.innerHTML = `
      <div class="modal">
        <h3>Staff</h3>
        ${list.length ? list.map(s=>`<button class="btn btn-outline btn-block" data-sid="${s.id}" style="margin-bottom:8px;">${esc(s.name)}</button>`).join("")
          : `<p style="color:var(--crema-dim); font-size:13px;">No staff members yet. Ask the developer to add them.</p>`}
        <div class="modal-actions"><button class="btn btn-outline" id="stfCancel">Cancel</button></div>
      </div>`;
    bg.querySelector("#stfCancel").onclick = ()=>bg.remove();
    bg.querySelectorAll("[data-sid]").forEach(b=>{
      b.onclick = ()=>{
        const staff = list.find(s=>s.id===b.dataset.sid);
        if(!staff) return;
        if(state.db.meta.staffPinRequired){
          if(!staff.pinHash){ toast("No PIN set for this person — ask the developer","err"); return; }
          showPin(staff);
        } else choose(staff);
      };
    });
  }
  showList();
  // pick up staff added on another device a moment ago, then redraw the list
  if(navigator.onLine && state.accessToken){
    pullFromDrive(true).then(()=>{
      if(!document.body.contains(bg) || bg.querySelector("#stfPinInput")) return;
      list = activeStaff().slice().sort(byName);
      showList();
    });
  }
}

/* developer: the Staff tab */
function renderStaffPanel(el){
  const m = state.db.meta;
  const periodLabel = { day:"day", week:"week", month:"month" };
  el.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:12px; font-size:15px;">Staff allowance</h3>
      <div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="stfEnabled" style="width:auto;" ${m.staffEnabled?"checked":""}/> Turn on Staff allowance (shows a “Staff” button on the cashier screen)</label></div>
      <div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="stfPin" style="width:auto;" ${m.staffPinRequired?"checked":""}/> Ask for each person's 4-digit PIN when a cashier selects them</label></div>
      <div class="field"><label>Discount on allowance items (%) — 100 means free</label><input type="number" id="stfPct" min="0" max="100" value="${m.staffDiscountPercent===undefined?100:m.staffDiscountPercent}" style="max-width:120px;" /></div>
      <table style="margin-top:8px;"><thead><tr><th>Name</th><th>Allowance</th><th>Status</th><th></th></tr></thead><tbody id="staffBody"></tbody></table>
      <button class="btn btn-primary" id="addStaffBtn" style="margin-top:14px;">➕ Add staff member</button>
      <button class="btn btn-outline" id="addTeamStaffBtn" style="margin-top:14px; margin-left:8px;">👥 Add all team members</button>
    </div>`;
  $("#stfEnabled").onchange = async e=>{ state.db.meta.staffEnabled = e.target.checked; await pushToDrive(); render(); };
  $("#stfPin").onchange = async e=>{ state.db.meta.staffPinRequired = e.target.checked; await pushToDrive(); render(); };
  $("#stfPct").onchange = async e=>{
    const v = Math.max(0, Math.min(100, parseFloat(e.target.value)));
    state.db.meta.staffDiscountPercent = isNaN(v) ? 100 : v;
    await pushToDrive(); render();
  };
  const body = $("#staffBody");
  const list = allStaff();
  if(list.length===0){
    body.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--crema-dim); padding:24px;">No staff members yet.</td></tr>`;
  }
  list.forEach(s=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(s.name)}</td>
      <td>${s.drinksAllowed||0} drinks + ${s.foodAllowed||0} food / ${periodLabel[s.period]||"day"}</td>
      <td style="color:${s.active===false?'var(--err)':'var(--ok)'};">${s.active===false?"Disabled":"Active"}</td>
      <td><a class="link" data-sid="${s.id}">Edit</a></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll("a[data-sid]").forEach(a=>{ a.onclick = ()=>openStaffModal(allStaff().find(s=>s.id===a.dataset.sid)); });
  $("#addStaffBtn").onclick = ()=>openStaffModal(null);
  $("#addTeamStaffBtn").onclick = async ()=>{
    const have = new Set(allStaff().map(s=>String(s.name).trim().toLowerCase()));
    let n = 0;
    activeUsers().filter(u=>u.role!=="developer" && u.active!==false).forEach(u=>{
      const name = (u.name || u.username || "").trim();
      if(!name || have.has(name.toLowerCase())) return;
      state.db.staff.push({ id: uid(), name, drinksAllowed:0, foodAllowed:0, period:"day", active:true, pinHash:null, createdAt: nowIso(), updatedAt: nowIso() });
      have.add(name.toLowerCase()); n++;
    });
    if(!n){ toast("Everyone from the team is already in the list","ok"); return; }
    await pushToDrive();
    toast(n + " added — now set each person's allowance","ok");
    render();
  };
}

function openStaffModal(staff){
  const isNew = !staff;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "Add staff member" : "Edit staff member"}</h3>
      <div class="field"><label>Name</label><input id="sfName" value="${staff?esc(staff.name):""}" /></div>
      <div class="inline-row">
        <div class="field"><label>Drinks per period</label><input id="sfDrinks" type="number" min="0" step="1" value="${staff?(staff.drinksAllowed||0):0}" /></div>
        <div class="field"><label>Food per period</label><input id="sfFood" type="number" min="0" step="1" value="${staff?(staff.foodAllowed||0):0}" /></div>
      </div>
      <div class="field"><label>Period (counts reset automatically)</label>
        <select id="sfPeriod">
          ${[["day","Every day"],["week","Every week (Mon–Sun)"],["month","Every month"]].map(([v,l])=>`<option value="${v}" ${(staff?staff.period:"day")===v?"selected":""}>${l}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>${isNew ? "PIN (4 digits — only used when the PIN switch is on)" : "New PIN (4 digits — leave blank to keep the current one)"}</label><input id="sfPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" /></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="sfActive" style="width:auto;" ${staff.active!==false?"checked":""}/> Active</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="delStaff">Remove</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelStaff">Cancel</button>
        <button class="btn btn-primary" id="saveStaff">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#cancelStaff").onclick = ()=>bg.remove();
  bg.querySelector("#saveStaff").onclick = async ()=>{
    const name = bg.querySelector("#sfName").value.trim();
    const drinks = Math.max(0, parseInt(bg.querySelector("#sfDrinks").value,10) || 0);
    const food = Math.max(0, parseInt(bg.querySelector("#sfFood").value,10) || 0);
    const period = bg.querySelector("#sfPeriod").value;
    const pin = bg.querySelector("#sfPin").value.trim();
    if(!name){ toast("Enter a name","err"); return; }
    if(pin && !/^\d{4}$/.test(pin)){ toast("PIN must be exactly 4 digits","err"); return; }
    if(isNew){
      const rec = { id: uid(), name, drinksAllowed: drinks, foodAllowed: food, period, active:true, pinHash:null, createdAt: nowIso(), updatedAt: nowIso() };
      if(pin) rec.pinHash = await sha256(rec.id+":"+pin);
      state.db.staff.push(rec);
    } else {
      Object.assign(staff, { name, drinksAllowed: drinks, foodAllowed: food, period, active: bg.querySelector("#sfActive").checked, updatedAt: nowIso() });
      if(pin) staff.pinHash = await sha256(staff.id+":"+pin);
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew){
    bg.querySelector("#delStaff").onclick = async ()=>{
      staff.deleted = true; staff.active = false; staff.updatedAt = nowIso();
      if(state.staffMember && state.staffMember.id===staff.id) state.staffMember = null;
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ================= DEVELOPER VIEW ================= */
function renderDeveloperView(el){
  const toggleWrap = document.createElement("div");
  toggleWrap.className = "banner " + (state.db.meta.appActive ? "" : "err");
  toggleWrap.style.display = "flex";
  toggleWrap.style.justifyContent = "space-between";
  toggleWrap.style.alignItems = "center";
  toggleWrap.style.border = "1px solid var(--line)";
  toggleWrap.style.background = "var(--espresso-2)";
  toggleWrap.innerHTML = `
    <div>
      <b>Main system ${state.db.meta.appActive ? "is active" : "is deactivated"}</b>
      <div style="font-size:12px; color:var(--crema-dim); margin-top:2px;">Clones on cashier devices sync automatically and follow this switch.</div>
    </div>
    <button class="btn ${state.db.meta.appActive ? 'btn-danger':'btn-primary'}" id="toggleActive">${state.db.meta.appActive ? "Deactivate" : "Activate"}</button>
  `;
  el.appendChild(toggleWrap);
  el.appendChild(document.createElement("div")).style.height="14px";

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  [["products","Menu buttons"],["categories","Categories"],["coupons","Coupons"],["settings","Settings"],["staff","Staff"],["team",`${roleLabel('cashier')}s & ${roleLabel('admin')}s`],["live","Live sales"],["reports","Day reports"],["analytics","Sales reports"],["inventory","Inventory" + invBadge()]].forEach(([key,label])=>{
    const t = document.createElement("div");
    t.className = "tab" + (state.devTab===key ? " active":"");
    t.textContent = label;
    t.onclick = ()=>{ state.devTab = key; render(); };
    tabs.appendChild(t);
  });
  el.appendChild(tabs);

  const body = document.createElement("div");
  el.appendChild(body);

  $("#toggleActive").onclick = async ()=>{
    state.db.meta.appActive = !state.db.meta.appActive;
    await pushToDrive();
    render();
  };

  if(state.devTab==="products") return renderMenuList(body, true);
  if(state.devTab==="categories") return renderCategoriesList(body, true);
  if(state.devTab==="coupons") return renderCouponsList(body, true);
  if(state.devTab==="settings"){ renderSettingsPanel(body); appendBackupCard(body); return; }
  if(state.devTab==="analytics") return renderAnalyticsPanel(body, true);
  if(state.devTab==="inventory") return renderInventoryPanel(body, "developer");
  if(state.devTab==="staff") return renderStaffPanel(body);
  if(state.devTab==="team") return renderTeamList(body, true);
  if(state.devTab==="live") return renderLiveSales(body, true);
  if(state.devTab==="reports") return renderReportsList(body, true);
}

/* ---------------- boot ---------------- */
init();
</script>
